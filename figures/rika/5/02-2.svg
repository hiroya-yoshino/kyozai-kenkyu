<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="発芽と水の関係を調べる実験の条件" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>発芽と水の関係を調べる実験の条件</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="270" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">発芽と水の関係を調べる</text><path d="M90,70 L102,150 L208,150 L220,70" fill="none" stroke="#1f2a44" stroke-width="2.5"/><rect x="100" y="126" width="110" height="20" fill="#fbfbf7" stroke="#5b6573" stroke-dasharray="3 3"/><rect x="100" y="132" width="110" height="14" fill="#cfe6f3" opacity=".8"/><ellipse cx="112" cy="122" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="134" cy="122" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="156" cy="122" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="178" cy="122" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><text x="155.0" y="178" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">ア　水をあたえる</text><path d="M300,70 L312,150 L418,150 L430,70" fill="none" stroke="#1f2a44" stroke-width="2.5"/><rect x="310" y="126" width="110" height="20" fill="#fbfbf7" stroke="#5b6573" stroke-dasharray="3 3"/><ellipse cx="322" cy="122" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="344" cy="122" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="366" cy="122" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="388" cy="122" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><text x="365.0" y="178" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">イ　水をあたえない</text><rect x="470" y="70" width="70" height="30" fill="#eef3ee" stroke="#5b6573"/><text x="505.0" y="90" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">条件</text><rect x="540" y="70" width="80" height="30" fill="#eef3ee" stroke="#5b6573"/><text x="580.0" y="90" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">ア</text><rect x="620" y="70" width="80" height="30" fill="#eef3ee" stroke="#5b6573"/><text x="660.0" y="90" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">イ</text><rect x="470" y="100" width="70" height="30" fill="#fff" stroke="#5b6573"/><text x="505.0" y="120" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">水</text><rect x="540" y="100" width="80" height="30" fill="#fff" stroke="#5b6573"/><text x="580.0" y="120" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="normal">あり</text><rect x="620" y="100" width="80" height="30" fill="#fff" stroke="#5b6573"/><text x="660.0" y="120" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">なし</text><rect x="470" y="130" width="70" height="30" fill="#fff" stroke="#5b6573"/><text x="505.0" y="150" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">空気</text><rect x="540" y="130" width="80" height="30" fill="#fff" stroke="#5b6573"/><text x="580.0" y="150" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">ふれる</text><rect x="620" y="130" width="80" height="30" fill="#fff" stroke="#5b6573"/><text x="660.0" y="150" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">ふれる</text><rect x="470" y="160" width="70" height="30" fill="#fff" stroke="#5b6573"/><text x="505.0" y="180" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">温度</text><rect x="540" y="160" width="80" height="30" fill="#fff" stroke="#5b6573"/><text x="580.0" y="180" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">室温</text><rect x="620" y="160" width="80" height="30" fill="#fff" stroke="#5b6573"/><text x="660.0" y="180" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">室温</text><rect x="470" y="190" width="70" height="30" fill="#fff" stroke="#5b6573"/><text x="505.0" y="210" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">置き場所</text><rect x="540" y="190" width="80" height="30" fill="#fff" stroke="#5b6573"/><text x="580.0" y="210" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">同じ</text><rect x="620" y="190" width="80" height="30" fill="#fff" stroke="#5b6573"/><text x="660.0" y="210" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">同じ</text><text x="360" y="250" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">調べたい条件（水）だけを変え、ほかの条件はすべて同じにする</text>
</svg>