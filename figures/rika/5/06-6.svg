<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="上流・中流・下流の川はばと川原の石の大きさや形のちがい" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>上流・中流・下流の川はばと川原の石の大きさや形のちがい</title>
<defs>
