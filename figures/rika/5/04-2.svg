<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-label="ヘチマのめばなとおばなのつくり" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>ヘチマのめばなとおばなのつくり</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="392" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">ヘチマのめばなとおばな</text><text x="190" y="64" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">めばな</text><ellipse cx="190" cy="108" rx="30" ry="22" transform="rotate(-90 190 108)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="230" cy="137" rx="30" ry="22" transform="rotate(-18 230 137)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="215" cy="184" rx="30" ry="22" transform="rotate(54 215 184)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="165" cy="184" rx="30" ry="22" transform="rotate(126 165 184)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="150" cy="137" rx="30" ry="22" transform="rotate(198 150 137)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><circle cx="190" cy="150" r="18" fill="#f9e9a6" stroke="#b8921a" stroke-width="1.5"/><circle cx="190" cy="150" r="10" fill="#9cc66b" stroke="#4f8a3c" stroke-width="2"/><ellipse cx="190" cy="250" rx="16" ry="44" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="2.5"/><line x1="190" y1="294" x2="190" y2="330" stroke="#4f8a3c" stroke-width="4"/><text x="110" y="154" font-size="14" fill="#c8372d" text-anchor="end" font-weight="bold">めしべ</text><line x1="114" y1="150" x2="178" y2="150" stroke="#c8372d"/><text x="110" y="254" font-size="14" fill="#c8372d" text-anchor="end" font-weight="bold">めしべのもと</text><text x="110" y="272" font-size="12" fill="#5b6573" text-anchor="end" font-weight="normal">（ふくらんでいる）</text><line x1="114" y1="250" x2="172" y2="250" stroke="#c8372d"/><text x="530" y="64" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">おばな</text><ellipse cx="530" cy="108" rx="30" ry="22" transform="rotate(-90 530 108)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="570" cy="137" rx="30" ry="22" transform="rotate(-18 570 137)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="555" cy="184" rx="30" ry="22" transform="rotate(54 555 184)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="505" cy="184" rx="30" ry="22" transform="rotate(126 505 184)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="490" cy="137" rx="30" ry="22" transform="rotate(198 490 137)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><circle cx="530" cy="150" r="18" fill="#f9e9a6" stroke="#b8921a" stroke-width="1.5"/><circle cx="524" cy="145" r="5" fill="#e0a12a" stroke="#a46d0e"/><circle cx="536" cy="145" r="5" fill="#e0a12a" stroke="#a46d0e"/><circle cx="530" cy="156" r="5" fill="#e0a12a" stroke="#a46d0e"/><line x1="530" y1="200" x2="530" y2="330" stroke="#4f8a3c" stroke-width="4"/><text x="610" y="154" font-size="14" fill="#c8372d" text-anchor="start" font-weight="bold">おしべ</text><line x1="540" y1="150" x2="606" y2="150" stroke="#c8372d"/><text x="610" y="174" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">先に花粉がある</text><text x="360" y="372" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">どちらの花にも、花びらとがくがある。めばなのめしべのもとが、やがて実になる</text>
</svg>