<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="発芽前の種子としぼんだ子葉にヨウ素液をつけたときのちがい" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>発芽前の種子としぼんだ子葉にヨウ素液をつけたときのちがい</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="260" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">子葉にヨウ素液をつけると</text><ellipse cx="190" cy="120" rx="70" ry="44" fill="#3b5ba5" stroke="#1f2a44" stroke-width="2.5"/><path d="M132,112 q14,-14 30,-6" stroke="#4f8a3c" stroke-width="4" fill="none"/><text x="190" y="194" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">発芽前の種子</text><text x="190" y="216" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">青むらさき色に変わる</text><text x="190" y="240" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">→ でんぷんがある</text><ellipse cx="530" cy="120" rx="50" ry="28" fill="#efe6c9" stroke="#1f2a44" stroke-width="2.5"/><text x="530" y="194" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">発芽後のしぼんだ子葉</text><text x="530" y="216" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">ほとんど色が変わらない</text><text x="530" y="240" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">→ でんぷんが使われた</text><path d="M290,120 L450,120" stroke="#1f2a44" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)" fill="none"/><text x="370" y="108" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">発芽して育つ</text><text x="110" y="70" font-size="12" fill="#4f8a3c" text-anchor="middle" font-weight="normal">根・くき・葉になる部分</text>
</svg>