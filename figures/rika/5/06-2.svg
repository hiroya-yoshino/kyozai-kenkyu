<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="土の山に水を流す実験と、けずられる所・積もる所" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>土の山に水を流す実験と、けずられる所・積もる所</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="380" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">土の山に水を流して、流れる水のはたらきを調べる</text><path d="M60,330 L250,90 L470,90 L660,330 z" fill="#e8d3b0" stroke="#1f2a44" stroke-width="2.5"/><path d="M330,90 C300,150 420,170 380,220 C340,270 250,270 300,330" stroke="#8fb3c9" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M330,90 C300,150 420,170 380,220 C340,270 250,270 300,330" stroke="#4d8fbf" stroke-width="3" fill="none" stroke-dasharray="10 8"/><line x1="410" y1="196" x2="410" y2="170" stroke="#1f2a44" stroke-width="2"/><path d="M410,170 l14,5 l-14,5 z" fill="#c8372d"/><line x1="350" y1="212" x2="350" y2="186" stroke="#1f2a44" stroke-width="2"/><path d="M350,186 l14,5 l-14,5 z" fill="#c8372d"/><line x1="300" y1="262" x2="300" y2="236" stroke="#1f2a44" stroke-width="2"/><path d="M300,236 l14,5 l-14,5 z" fill="#c8372d"/><line x1="250" y1="252" x2="250" y2="226" stroke="#1f2a44" stroke-width="2"/><path d="M250,226 l14,5 l-14,5 z" fill="#c8372d"/><path d="M330,60 l0,24" stroke="#4d8fbf" stroke-width="3" marker-end="url(#arr)"/><text x="330" y="54" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">水を流す</text><text x="700" y="140" font-size="13" fill="#1f2a44" text-anchor="end" font-weight="bold">曲がっているところの外側</text><text x="700" y="158" font-size="13" fill="#c8372d" text-anchor="end" font-weight="bold">→ けずられる</text><line x1="560" y1="164" x2="418" y2="198" stroke="#5b6573"/><text x="140" y="210" font-size="13" fill="#1f2a44" text-anchor="end" font-weight="bold">内側</text><text x="140" y="228" font-size="13" fill="#1e7f6e" text-anchor="end" font-weight="bold">→ 土が積もる</text><line x1="144" y1="216" x2="238" y2="246" stroke="#5b6573"/><text x="420" y="300" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="bold">ふもと（流れがゆるやか）</text><text x="420" y="318" font-size="13" fill="#1e7f6e" text-anchor="start" font-weight="bold">→ 土が積もる</text><line x1="416" y1="308" x2="318" y2="322" stroke="#5b6573"/><text x="360" y="362" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">目印の旗のたおれ方や、土がけずられた所・積もった所を記録する</text>
</svg>