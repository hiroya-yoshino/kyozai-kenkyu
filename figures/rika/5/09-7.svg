<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="電流の大きさとコイルの巻数を変えて電磁石の強さを比べる実験の条件" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>電流の大きさとコイルの巻数を変えて電磁石の強さを比べる実験の条件</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="290" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">電磁石の強さを比べる実験の条件</text><rect x="15" y="60" width="150" height="46" fill="#eef3ee" stroke="#5b6573"/><text x="90.0" y="89" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold"></text><rect x="165" y="60" width="270" height="46" fill="#eef3ee" stroke="#5b6573"/><text x="300.0" y="89" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">電流の大きさを変える</text><rect x="435" y="60" width="270" height="46" fill="#eef3ee" stroke="#5b6573"/><text x="570.0" y="89" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">コイルの巻数を変える</text><rect x="15" y="106" width="150" height="46" fill="#eef3ee" stroke="#5b6573"/><text x="90.0" y="135" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">変える条件</text><rect x="165" y="106" width="270" height="46" fill="#fff" stroke="#5b6573"/><text x="300.0" y="135" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">かん電池1個 ／ 2個（直列）</text><rect x="435" y="106" width="270" height="46" fill="#fff" stroke="#5b6573"/><text x="570.0" y="135" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">100回巻き ／ 200回巻き</text><rect x="15" y="152" width="150" height="46" fill="#eef3ee" stroke="#5b6573"/><text x="90.0" y="181" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">同じにする条件</text><rect x="165" y="152" width="270" height="46" fill="#fff" stroke="#5b6573"/><text x="300.0" y="181" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">巻数・導線の長さ・鉄心</text><rect x="435" y="152" width="270" height="46" fill="#fff" stroke="#5b6573"/><text x="570.0" y="181" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">電流の大きさ・導線の長さ・鉄心</text><rect x="15" y="198" width="150" height="46" fill="#eef3ee" stroke="#5b6573"/><text x="90.0" y="227" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">強さの比べ方</text><rect x="165" y="198" width="270" height="46" fill="#fff" stroke="#5b6573"/><text x="300.0" y="227" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">引きつけるゼムクリップの数</text><rect x="435" y="198" width="270" height="46" fill="#fff" stroke="#5b6573"/><text x="570.0" y="227" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">引きつけるゼムクリップの数</text><text x="360" y="270" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">巻数を比べるときは、エナメル線全体の長さをそろえ、あまった分は巻かずに束ねておく</text>
</svg>