<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 266" role="img" aria-label="問題解決の進め方と、5年で大切にする条件の制御" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>問題解決の進め方と、5年で大切にする条件の制御</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="266" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">問題解決の進め方</text><rect x="14" y="70" width="84" height="50" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="56.0" y="100.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">問題</text><path d="M100,95 L112,95" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="114" y="70" width="84" height="50" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="156.0" y="100.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">予想</text><path d="M200,95 L212,95" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="214" y="70" width="84" height="50" rx="8" fill="#e3f1ee" stroke="#1f2a44" stroke-width="2"/><text x="256.0" y="100.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">計画</text><path d="M300,95 L312,95" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="314" y="70" width="84" height="50" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="356.0" y="100.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">観察・実験</text><path d="M400,95 L412,95" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="414" y="70" width="84" height="50" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="456.0" y="100.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">結果</text><path d="M500,95 L512,95" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="514" y="70" width="84" height="50" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="556.0" y="100.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">考察</text><path d="M600,95 L612,95" stroke="#5b6573" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="614" y="70" width="84" height="50" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="656.0" y="100.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">結論</text><path d="M256,124 L256,150" stroke="#1e7f6e" stroke-width="2"/><rect x="120" y="150" width="480" height="96" rx="10" fill="#f3faf7" stroke="#1e7f6e" stroke-width="2"/><text x="360" y="178" font-size="15" fill="#1e7f6e" text-anchor="middle" font-weight="bold">5年で大切にすること：条件を制御する</text><text x="360" y="206" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">調べたい条件（変える条件）は1つだけにして、</text><text x="360" y="228" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">ほかの条件（変えない条件）はすべてそろえて比べる</text>
</svg>