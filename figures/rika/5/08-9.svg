<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="湯せんでとけ残りのある水よう液をあたためる方法" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>湯せんでとけ残りのある水よう液をあたためる方法</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="340" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">湯せんで水よう液をあたためる</text><path d="M150,120 L170,300 L450,300 L470,120" fill="#fbe9dd" stroke="#1f2a44" stroke-width="2.5"/><text x="310" y="322" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">湯（約60℃・先生が用意する）</text><path d="M250,110 L250,280 L370,280 L370,110" fill="none" stroke="#1f2a44" stroke-width="2.5"/><rect x="252" y="178" width="116" height="100" fill="#eaf4fa"/><rect x="270" y="262" width="8" height="8" fill="#fff" stroke="#5b6573"/><rect x="300" y="262" width="8" height="8" fill="#fff" stroke="#5b6573"/><rect x="330" y="262" width="8" height="8" fill="#fff" stroke="#5b6573"/><text x="242" y="140" font-size="13" fill="#1f2a44" text-anchor="end" font-weight="bold">水50mL＋</text><text x="242" y="158" font-size="13" fill="#1f2a44" text-anchor="end" font-weight="bold">とけ残り</text><rect x="341" y="70" width="8" height="180" rx="4" fill="#fff" stroke="#1f2a44" stroke-width="1.5"/><circle cx="345" cy="250" r="7" fill="#c8372d"/><line x1="345" y1="250" x2="345" y2="100" stroke="#c8372d" stroke-width="3"/><line x1="285" y1="60" x2="300" y2="250" stroke="#5b6573" stroke-width="4"/><text x="240" y="66" font-size="12" fill="#5b6573" text-anchor="end" font-weight="normal">ガラス棒</text><text x="500" y="160" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">温度計で温度を確かめる</text><text x="500" y="186" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">ガラス棒でかき混ぜる</text><text x="500" y="212" font-size="12" fill="#c8372d" text-anchor="start" font-weight="normal">（温度計でかき混ぜない）</text><text x="500" y="252" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">とけたら、さらに1ぱい</text><text x="500" y="272" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">ずつ加えて調べる</text>
</svg>