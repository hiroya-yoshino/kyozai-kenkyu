<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 314" role="img" aria-label="メダカ・ヘチマ・ヒトの生命の始まり・育つ場所・養分・期間を比べる表" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>メダカ・ヘチマ・ヒトの生命の始まり・育つ場所・養分・期間を比べる表</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="314" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">生命のつながり方を比べる</text><rect x="10" y="56" width="140" height="44" fill="#eef3ee" stroke="#5b6573"/><text x="80.0" y="84" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold"></text><rect x="150" y="56" width="180" height="44" fill="#eef3ee" stroke="#5b6573"/><text x="240.0" y="84" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">メダカ</text><rect x="330" y="56" width="190" height="44" fill="#eef3ee" stroke="#5b6573"/><text x="425.0" y="84" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">ヘチマ（植物）</text><rect x="520" y="56" width="190" height="44" fill="#eef3ee" stroke="#5b6573"/><text x="615.0" y="84" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">ヒト</text><rect x="10" y="100" width="140" height="44" fill="#eef3ee" stroke="#5b6573"/><text x="80.0" y="128" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">始まり</text><rect x="150" y="100" width="180" height="44" fill="#fff" stroke="#5b6573"/><text x="240.0" y="128" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">受精（卵と精子）</text><rect x="330" y="100" width="190" height="44" fill="#fff" stroke="#5b6573"/><text x="425.0" y="128" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">受粉して実と種子</text><rect x="520" y="100" width="190" height="44" fill="#fff" stroke="#5b6573"/><text x="615.0" y="128" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">受精（卵と精子）</text><rect x="10" y="144" width="140" height="44" fill="#eef3ee" stroke="#5b6573"/><text x="80.0" y="172" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">育つ場所</text><rect x="150" y="144" width="180" height="44" fill="#fff" stroke="#5b6573"/><text x="240.0" y="172" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">水中の卵の中</text><rect x="330" y="144" width="190" height="44" fill="#fff" stroke="#5b6573"/><text x="425.0" y="172" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">実の中の種子→土</text><rect x="520" y="144" width="190" height="44" fill="#fff" stroke="#5b6573"/><text x="615.0" y="172" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">母親の子宮の中</text><rect x="10" y="188" width="140" height="44" fill="#eef3ee" stroke="#5b6573"/><text x="80.0" y="216" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">育つための養分</text><rect x="150" y="188" width="180" height="44" fill="#fff" stroke="#5b6573"/><text x="240.0" y="216" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">卵の中の養分</text><rect x="330" y="188" width="190" height="44" fill="#fff" stroke="#5b6573"/><text x="425.0" y="216" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">種子（子葉）の養分</text><rect x="520" y="188" width="190" height="44" fill="#fff" stroke="#5b6573"/><text x="615.0" y="216" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">へそのおを通して母親から</text><rect x="10" y="232" width="140" height="44" fill="#eef3ee" stroke="#5b6573"/><text x="80.0" y="260" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">生まれるまで</text><rect x="150" y="232" width="180" height="44" fill="#fff" stroke="#5b6573"/><text x="240.0" y="260" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">約11日（水温25℃）</text><rect x="330" y="232" width="190" height="44" fill="#fff" stroke="#5b6573"/><text x="425.0" y="260" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">発芽まで数日〜</text><rect x="520" y="232" width="190" height="44" fill="#fff" stroke="#5b6573"/><text x="615.0" y="260" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">約38週間</text><text x="360" y="296" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">どれも、新しい生命が育ち、また次の生命につながっていく</text>
</svg>