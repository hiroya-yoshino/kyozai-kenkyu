<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" role="img" aria-label="台風が南の海上で発生し、向きを変えながら日本付近に近づく進み方の例" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>台風が南の海上で発生し、向きを変えながら日本付近に近づく進み方の例</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="412" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">台風の進み方の例（模式図）</text><rect x="20" y="50" width="680" height="330" rx="8" fill="#e8f1f7"/><path d="M210,300 Q330,265 400,220 T470,130" stroke="#1f2a44" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M210,300 Q330,265 400,220 T470,130" stroke="#f4efe3" stroke-width="26" fill="none" stroke-linecap="round"/><ellipse cx="495" cy="106" rx="30" ry="20" fill="#f4efe3" stroke="#1f2a44" stroke-width="1.5"/><ellipse cx="185" cy="322" rx="16" ry="22" fill="#f4efe3" stroke="#1f2a44" stroke-width="1.5"/><ellipse cx="262" cy="312" rx="18" ry="9" fill="#f4efe3" stroke="#1f2a44" stroke-width="1.5"/><text x="470" y="200" font-size="14" fill="#5b6573" text-anchor="start" font-weight="bold">日本</text><path d="M560,365 L480,350 L400,330 L330,300 L300,250 L340,195 L420,150 L540,105" fill="none" stroke="#c8372d" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arr)"/><circle cx="560" cy="365" r="7" fill="#fff" stroke="#c8372d" stroke-width="2"/><text x="548" y="355" font-size="11" fill="#1f2a44" text-anchor="end" font-weight="normal">1日目</text><circle cx="480" cy="350" r="7" fill="#fff" stroke="#c8372d" stroke-width="2"/><text x="468" y="340" font-size="11" fill="#1f2a44" text-anchor="end" font-weight="normal">2日目</text><circle cx="400" cy="330" r="7" fill="#fff" stroke="#c8372d" stroke-width="2"/><text x="388" y="320" font-size="11" fill="#1f2a44" text-anchor="end" font-weight="normal">3日目</text><circle cx="330" cy="300" r="7" fill="#fff" stroke="#c8372d" stroke-width="2"/><text x="318" y="290" font-size="11" fill="#1f2a44" text-anchor="end" font-weight="normal">4日目</text><circle cx="300" cy="250" r="7" fill="#fff" stroke="#c8372d" stroke-width="2"/><text x="288" y="240" font-size="11" fill="#1f2a44" text-anchor="end" font-weight="normal">5日目</text><circle cx="340" cy="195" r="7" fill="#fff" stroke="#c8372d" stroke-width="2"/><text x="328" y="185" font-size="11" fill="#1f2a44" text-anchor="end" font-weight="normal">6日目</text><circle cx="420" cy="150" r="7" fill="#fff" stroke="#c8372d" stroke-width="2"/><text x="408" y="140" font-size="11" fill="#1f2a44" text-anchor="end" font-weight="normal">7日目</text><text x="640" y="360" font-size="13" fill="#c8372d" text-anchor="middle" font-weight="bold">南の海上で発生</text><text x="120" y="120" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">はじめは西や北へ進み、</text><text x="120" y="140" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">その後、北や東へ</text><text x="120" y="160" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">向きを変えることが多い</text><text x="360" y="400" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">進み方は台風ごとにちがう。気象情報で進路の予想を確かめる</text>
</svg>