<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="流れる水のしん食・運ぱん・たい積のはたらき" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>流れる水のしん食・運ぱん・たい積のはたらき</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="300" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">流れる水の3つのはたらき</text><rect x="30" y="60" width="210" height="190" rx="10" fill="#f6f9fb" stroke="#d5e1ea"/><text x="135" y="92" font-size="20" fill="#1e7f6e" text-anchor="middle" font-weight="bold">しん食</text><text x="135" y="116" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">地面をけずる</text><rect x="50" y="160" width="170" height="60" fill="#e8d3b0"/><path d="M50,160 L220,160" stroke="#1f2a44" stroke-width="1.5"/><path d="M60,150 L210,150" stroke="#4d8fbf" stroke-width="3" marker-end="url(#arr)"/><path d="M90,160 q45,40 90,0 z" fill="#ffffff" stroke="#c8372d" stroke-width="2" stroke-dasharray="4 3"/><text x="135" y="238" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">流れが速いほど大きい</text><rect x="260" y="60" width="210" height="190" rx="10" fill="#f6f9fb" stroke="#d5e1ea"/><text x="365" y="92" font-size="20" fill="#1e7f6e" text-anchor="middle" font-weight="bold">運ぱん</text><text x="365" y="116" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">土や石を運ぶ</text><rect x="280" y="160" width="170" height="60" fill="#e8d3b0"/><path d="M280,160 L450,160" stroke="#1f2a44" stroke-width="1.5"/><path d="M290,150 L440,150" stroke="#4d8fbf" stroke-width="3" marker-end="url(#arr)"/><circle cx="310" cy="140" r="6" fill="#a88b62" stroke="#1f2a44"/><circle cx="350" cy="136" r="5" fill="#a88b62" stroke="#1f2a44"/><circle cx="390" cy="142" r="4" fill="#a88b62" stroke="#1f2a44"/><circle cx="420" cy="138" r="3" fill="#a88b62" stroke="#1f2a44"/><text x="365" y="238" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">流れが速いほど大きい</text><rect x="490" y="60" width="210" height="190" rx="10" fill="#f6f9fb" stroke="#d5e1ea"/><text x="595" y="92" font-size="20" fill="#1e7f6e" text-anchor="middle" font-weight="bold">たい積</text><text x="595" y="116" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">土や石を積もらせる</text><rect x="510" y="160" width="170" height="60" fill="#e8d3b0"/><path d="M510,160 L680,160" stroke="#1f2a44" stroke-width="1.5"/><path d="M520,150 L670,150" stroke="#4d8fbf" stroke-width="3" marker-end="url(#arr)"/><path d="M550,160 q45,-26 90,0 z" fill="#d8bf93" stroke="#1e7f6e" stroke-width="2"/><text x="595" y="238" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">流れがゆるやかな所で起こる</text><text x="360" y="280" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">流れる水の量が増えると流れが速くなり、しん食や運ぱんのはたらきが大きくなる</text>
</svg>