ll="#1e7f6e"/><text x="587" y="84.4" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="bold">28.7</text><text x="560" y="342" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">60℃</text><rect x="470" y="56" width="14" height="14" fill="#9aa7b8"/><text x="490" y="68" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">食塩</text><rect x="540" y="56" width="14" height="14" fill="#1e7f6e"/><text x="560" y="68" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">ミョウバン</text><text x="360" y="372" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">ミョウバンは温度が上がるととける量が大きく増える。食塩はほとんど変わらない</text>
</svg>