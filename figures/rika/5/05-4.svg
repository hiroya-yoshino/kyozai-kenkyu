<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-label="受精してから生まれるまでの子どもの大きさと体の変化の目安" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>受精してから生まれるまでの子どもの大きさと体の変化の目安</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="436" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">受精から生まれるまでの子どもの育ち（大きさは目安）</text><line x1="60" y1="200" x2="660" y2="200" stroke="#1f2a44" stroke-width="3"/><circle cx="60" cy="187" r="5" fill="#f6d5bd" stroke="#1f2a44" stroke-width="1.5"/><circle cx="60" cy="200" r="5" fill="#1e7f6e"/><circle cx="123" cy="184" r="8" fill="#f6d5bd" stroke="#1f2a44" stroke-width="1.5"/><circle cx="123" cy="200" r="5" fill="#1e7f6e"/><circle cx="186" cy="181" r="11" fill="#f6d5bd" stroke="#1f2a44" stroke-width="1.5"/><circle cx="186" cy="200" r="5" fill="#1e7f6e"/><circle cx="313" cy="174" r="18" fill="#f6d5bd" stroke="#1f2a44" stroke-width="1.5"/><circle cx="313" cy="200" r="5" fill="#1e7f6e"/><circle cx="439" cy="168" r="24" fill="#f6d5bd" stroke="#1f2a44" stroke-width="1.5"/><circle cx="439" cy="200" r="5" fill="#1e7f6e"/><circle cx="660" cy="157" r="35" fill="#f6d5bd" stroke="#1f2a44" stroke-width="1.5"/><circle cx="660" cy="200" r="5" fill="#1e7f6e"/><rect x="25" y="230" width="210" height="64" rx="8" fill="#f7f5ef" stroke="#e1dccf"/><text x="130" y="252" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">受精卵　約0.1mm</text><text x="130" y="276" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">母親の体内で受精する</text><rect x="255" y="230" width="210" height="64" rx="8" fill="#f7f5ef" stroke="#e1dccf"/><text x="360" y="252" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">4週　約0.4cm</text><text x="360" y="276" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">心臓が動き始める</text><rect x="485" y="230" width="210" height="64" rx="8" fill="#f7f5ef" stroke="#e1dccf"/><text x="590" y="252" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">8週　約3cm</text><text x="590" y="276" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">手や足の形がはっきり</text><rect x="25" y="308" width="210" height="64" rx="8" fill="#f7f5ef" stroke="#e1dccf"/><text x="130" y="330" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">16週　約16cm</text><text x="130" y="354" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">体の形や顔つきがわかる</text><rect x="255" y="308" width="210" height="64" rx="8" fill="#f7f5ef" stroke="#e1dccf"/><text x="360" y="330" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">24週　約30cm</text><text x="360" y="354" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">体を活発に動かす</text><rect x="485" y="308" width="210" height="64" rx="8" fill="#f7f5ef" stroke="#e1dccf"/><text x="590" y="330" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">38週　約50cm・約3kg</text><text x="590" y="354" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">生まれる</text><text x="360" y="418" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">週は受精してからの週数のめやす。子どもは約38週間、子宮の中で育つ</text>
</svg>