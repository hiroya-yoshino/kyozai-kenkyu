<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-label="受粉させた花とさせない花のめしべのもとの変化を比べる実験" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>受粉させた花とさせない花のめしべのもとの変化を比べる実験</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="490" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">受粉させる花とさせない花を比べる</text><text x="360" y="56" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">さく前のつぼみにふくろをかぶせておく（ほかの花粉がつかないように）</text><line x1="190" y1="230" x2="190" y2="340" stroke="#4f8a3c" stroke-width="4"/><ellipse cx="190" cy="128" rx="30" ry="22" transform="rotate(-90 190 128)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="230" cy="157" rx="30" ry="22" transform="rotate(-18 230 157)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="215" cy="204" rx="30" ry="22" transform="rotate(54 215 204)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="165" cy="204" rx="30" ry="22" transform="rotate(126 165 204)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="150" cy="157" rx="30" ry="22" transform="rotate(198 150 157)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><circle cx="190" cy="170" r="18" fill="#f9e9a6" stroke="#b8921a" stroke-width="1.5"/><circle cx="190" cy="170" r="10" fill="#9cc66b" stroke="#4f8a3c" stroke-width="2"/><ellipse cx="190" cy="250" rx="12" ry="26" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="2"/><path d="M128,110 Q190,70 252,110 L244,270 L136,270 z" fill="#ffffff" fill-opacity=".55" stroke="#5b6573" stroke-width="2" stroke-dasharray="6 4"/><rect x="176" y="266" width="28" height="8" rx="3" fill="#8a6bbf"/><circle cx="186" cy="168" r="3" fill="#e0a12a"/><circle cx="194" cy="172" r="3" fill="#e0a12a"/><circle cx="190" cy="175" r="3" fill="#e0a12a"/><circle cx="184" cy="174" r="3" fill="#e0a12a"/><line x1="530" y1="230" x2="530" y2="340" stroke="#4f8a3c" stroke-width="4"/><ellipse cx="530" cy="128" rx="30" ry="22" transform="rotate(-90 530 128)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="570" cy="157" rx="30" ry="22" transform="rotate(-18 570 157)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="555" cy="204" rx="30" ry="22" transform="rotate(54 555 204)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="505" cy="204" rx="30" ry="22" transform="rotate(126 505 204)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="490" cy="157" rx="30" ry="22" transform="rotate(198 490 157)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><circle cx="530" cy="170" r="18" fill="#f9e9a6" stroke="#b8921a" stroke-width="1.5"/><circle cx="530" cy="170" r="10" fill="#9cc66b" stroke="#4f8a3c" stroke-width="2"/><ellipse cx="530" cy="250" rx="12" ry="26" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="2"/><path d="M468,110 Q530,70 592,110 L584,270 L476,270 z" fill="#ffffff" fill-opacity=".55" stroke="#5b6573" stroke-width="2" stroke-dasharray="6 4"/><rect x="516" y="266" width="28" height="8" rx="3" fill="#8a6bbf"/><text x="190" y="372" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">ア　花粉をつける（受粉させる）</text><text x="530" y="372" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">イ　花粉をつけない</text><ellipse cx="190" cy="430" rx="22" ry="40" fill="#9cc66b" stroke="#4f8a3c" stroke-width="2.5"/><text x="250" y="436" font-size="14" fill="#1e7f6e" text-anchor="start" font-weight="bold">実ができる</text><ellipse cx="530" cy="440" rx="7" ry="16" fill="#d8cfa8" stroke="#5b6573" stroke-width="2"/><text x="560" y="446" font-size="14" fill="#5b6573" text-anchor="start" font-weight="bold">かれて落ちる</text><text x="80" y="412" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">数日後</text>
</svg>