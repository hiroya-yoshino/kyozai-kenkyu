<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" role="img" aria-label="エナメル線を巻いたコイルに鉄心を入れて電磁石をつくる" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>エナメル線を巻いたコイルに鉄心を入れて電磁石をつくる</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="356" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">電磁石のつくり方</text><rect x="186" y="138" width="268" height="24" rx="4" fill="#9aa1ab" stroke="#1f2a44" stroke-width="2"/><ellipse cx="200" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="216" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="232" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="248" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="264" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="280" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="296" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="312" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="328" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="344" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="360" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="376" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="392" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="408" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="424" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="440" cy="150" rx="4" ry="20.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><text x="320" y="112" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">エナメル線を同じ向きに100回巻く（コイル）</text><text x="320" y="210" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">鉄心（鉄くぎ・ボルト）</text><line x1="320" y1="194" x2="320" y2="164" stroke="#5b6573"/><path d="M200,170 C170,220 120,230 90,250" fill="none" stroke="#b8732e" stroke-width="2.5"/><path d="M440,170 C470,220 520,230 560,250" fill="none" stroke="#b8732e" stroke-width="2.5"/><line x1="78" y1="256" x2="92" y2="250" stroke="#c9a46b" stroke-width="5"/><line x1="560" y1="250" x2="574" y2="256" stroke="#c9a46b" stroke-width="5"/><text x="90" y="282" font-size="12" fill="#c8372d" text-anchor="middle" font-weight="normal">両はし約2cmのエナメルを</text><text x="90" y="298" font-size="12" fill="#c8372d" text-anchor="middle" font-weight="normal">紙やすりではがす</text><text x="560" y="282" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">かん電池・スイッチに</text><text x="560" y="298" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">つなぐ</text><text x="360" y="336" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">エナメル線は全部同じ向きに巻く。巻き終わりはセロハンテープでとめる</text>
</svg>