<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="ろうととろ紙を使ったろ過のしかた" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>ろうととろ紙を使ったろ過のしかた</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="360" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">ろ過のしかた</text><line x1="200" y1="90" x2="200" y2="330" stroke="#1f2a44" stroke-width="4"/><rect x="150" y="330" width="120" height="10" fill="#cfd6df" stroke="#1f2a44"/><line x1="200" y1="150" x2="330" y2="150" stroke="#1f2a44" stroke-width="4"/><path d="M290,140 L370,140 L336,200 L336,250 L324,250 L324,200 z" fill="#f4f7fa" stroke="#1f2a44" stroke-width="2.5"/><path d="M298,144 L362,144 L330,196 z" fill="#fff" stroke="#5b6573" stroke-dasharray="4 3"/><path d="M300,240 L300,330 L410,330 L410,240" fill="none" stroke="#1f2a44" stroke-width="2.5"/><rect x="302" y="303" width="106" height="25" fill="#cfe6f3"/><line x1="330" y1="250" x2="330" y2="305" stroke="#5b6573" stroke-dasharray="3 3"/><line x1="300" y1="70" x2="340" y2="170" stroke="#5b6573" stroke-width="4"/><path d="M230,60 L240,110 L300,96 L290,48 z" fill="#eaf4fa" stroke="#1f2a44" stroke-width="2"/><text x="470" y="100" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">ガラス棒に伝わらせて</text><text x="470" y="118" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">少しずつ注ぐ</text><line x1="466" y1="106" x2="320" y2="120" stroke="#5b6573"/><text x="470" y="170" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">ろ紙（水でぬらして</text><text x="470" y="188" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">ろうとにつける）</text><line x1="466" y1="176" x2="350" y2="170" stroke="#5b6573"/><text x="470" y="250" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">ろうとの先の長い方を</text><text x="470" y="268" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">ビーカーのかべにつける</text><line x1="466" y1="256" x2="338" y2="250" stroke="#5b6573"/><text x="470" y="316" font-size="13" fill="#1e7f6e" text-anchor="start" font-weight="bold">ろ液（ろ紙を通った液）</text><line x1="466" y1="312" x2="400" y2="312" stroke="#5b6573"/><text x="90" y="150" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">ろ紙の折り方</text><circle cx="90" cy="200" r="34" fill="#fff" stroke="#1f2a44" stroke-width="1.5"/><line x1="56" y1="200" x2="124" y2="200" stroke="#5b6573"/><line x1="90" y1="166" x2="90" y2="234" stroke="#5b6573"/><text x="90" y="256" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">4つ折りにして</text><text x="90" y="272" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">円すい形に開く</text>
</svg>