<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="理科室を安全に使うための6つの約束" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>理科室を安全に使うための6つの約束</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="320" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">理科室の安全の約束</text><rect x="20" y="60" width="210" height="90" rx="10" fill="#f6f9fb" stroke="#d5e1ea"/><circle cx="50" cy="105" r="16" fill="#1e7f6e"/><text x="50" y="111" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="76" y="102" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">立って実験する</text><text x="76" y="124" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">いすは机の下に入れる</text><rect x="250" y="60" width="210" height="90" rx="10" fill="#f6f9fb" stroke="#d5e1ea"/><circle cx="280" cy="105" r="16" fill="#1e7f6e"/><text x="280" y="111" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="306" y="102" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">机の上を片づける</text><text x="306" y="124" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">使わない物は置かない</text><rect x="480" y="60" width="210" height="90" rx="10" fill="#f6f9fb" stroke="#d5e1ea"/><circle cx="510" cy="105" r="16" fill="#1e7f6e"/><text x="510" y="111" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="536" y="102" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">保護めがねをかける</text><text x="536" y="124" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">薬品や加熱のとき</text><rect x="20" y="170" width="210" height="90" rx="10" fill="#f6f9fb" stroke="#d5e1ea"/><circle cx="50" cy="215" r="16" fill="#1e7f6e"/><text x="50" y="221" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="76" y="212" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">換気をする</text><text x="76" y="234" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">窓を開ける</text><rect x="250" y="170" width="210" height="90" rx="10" fill="#f6f9fb" stroke="#d5e1ea"/><circle cx="280" cy="215" r="16" fill="#1e7f6e"/><text x="280" y="221" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="306" y="212" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">長い髪はまとめる</text><text x="306" y="234" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">火に近づけない</text><rect x="480" y="170" width="210" height="90" rx="10" fill="#f6f9fb" stroke="#d5e1ea"/><circle cx="510" cy="215" r="16" fill="#1e7f6e"/><text x="510" y="221" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">6</text><text x="536" y="212" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">すぐ先生に知らせる</text><text x="536" y="234" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">けが・割れた・こぼした</text><text x="360" y="300" font-size="13" fill="#c8372d" text-anchor="middle" font-weight="bold">消火器・救急箱・水道の場所を確かめておく</text>
</svg>