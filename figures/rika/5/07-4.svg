<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="おもりの重さやふりこの長さを変えたときの1往復する時間の目安" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>おもりの重さやふりこの長さを変えたときの1往復する時間の目安</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="400" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">ふりこが1往復する時間（実験結果の目安）</text><text x="180" y="64" font-size="15" fill="#1e7f6e" text-anchor="middle" font-weight="bold">おもりの重さを変える</text><text x="180" y="84" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">（長さ50cm・ふれはば15°）</text><line x1="90" y1="104" x2="90" y2="214" stroke="#1f2a44" stroke-width="2"/><circle cx="90" cy="223" r="9" fill="#c9ced6" stroke="#1f2a44" stroke-width="2"/><text x="90" y="266" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">10g</text><text x="90" y="288" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">約1.4秒</text><line x1="180" y1="104" x2="180" y2="214" stroke="#1f2a44" stroke-width="2"/><circle cx="180" cy="226" r="12" fill="#c9ced6" stroke="#1f2a44" stroke-width="2"/><text x="180" y="266" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">20g</text><text x="180" y="288" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">約1.4秒</text><line x1="270" y1="104" x2="270" y2="214" stroke="#1f2a44" stroke-width="2"/><circle cx="270" cy="229" r="15" fill="#c9ced6" stroke="#1f2a44" stroke-width="2"/><text x="270" y="266" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">30g</text><text x="270" y="288" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">約1.4秒</text><text x="180" y="318" font-size="15" fill="#5b6573" text-anchor="middle" font-weight="bold">変わらない</text><text x="540" y="64" font-size="15" fill="#1e7f6e" text-anchor="middle" font-weight="bold">ふりこの長さを変える</text><text x="540" y="84" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">（おもり10g・ふれはば15°）</text><line x1="450" y1="104" x2="450" y2="159" stroke="#1f2a44" stroke-width="2"/><circle cx="450" cy="168" r="9" fill="#c9ced6" stroke="#1f2a44" stroke-width="2"/><text x="450" y="288" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">25cm</text><text x="450" y="308" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">約1.0秒</text><line x1="540" y1="104" x2="540" y2="214" stroke="#1f2a44" stroke-width="2"/><circle cx="540" cy="223" r="9" fill="#c9ced6" stroke="#1f2a44" stroke-width="2"/><text x="540" y="288" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">50cm</text><text x="540" y="308" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">約1.4秒</text><line x1="630" y1="104" x2="630" y2="254" stroke="#1f2a44" stroke-width="2"/><circle cx="630" cy="263" r="9" fill="#c9ced6" stroke="#1f2a44" stroke-width="2"/><text x="630" y="288" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">100cm</text><text x="630" y="308" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">約2.0秒</text><text x="540" y="338" font-size="15" fill="#1e7f6e" text-anchor="middle" font-weight="bold">長いほど、1往復の時間が長くなる</text><line x1="360" y1="60" x2="360" y2="340" stroke="#5b6573" stroke-dasharray="5 4"/><text x="360" y="380" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">ふれはばを変えても、1往復する時間はほとんど変わらない</text>
</svg>