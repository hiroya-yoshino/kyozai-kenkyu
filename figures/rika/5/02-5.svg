<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="発芽と温度・空気の関係を調べる実験" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>発芽と温度・空気の関係を調べる実験</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="300" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">発芽と温度・空気の関係を調べる</text><text x="185" y="62" font-size="15" fill="#1e7f6e" text-anchor="middle" font-weight="bold">温度を変える</text><text x="535" y="62" font-size="15" fill="#1e7f6e" text-anchor="middle" font-weight="bold">空気を変える</text><line x1="360" y1="50" x2="360" y2="250" stroke="#5b6573" stroke-dasharray="5 4"/><rect x="40" y="80" width="140" height="140" rx="8" fill="#eaf2f8" stroke="#1f2a44" stroke-width="2"/><text x="110" y="98" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">冷蔵庫の中</text><path d="M50,115 L62,195 L158,195 L170,115" fill="none" stroke="#1f2a44" stroke-width="2.5"/><rect x="60" y="171" width="100" height="20" fill="#fbfbf7" stroke="#5b6573" stroke-dasharray="3 3"/><rect x="60" y="177" width="100" height="14" fill="#cfe6f3" opacity=".8"/><ellipse cx="72" cy="167" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="94" cy="167" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="116" cy="167" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="138" cy="167" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><text x="110" y="240" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">約5℃（暗い）</text><path d="M200,115 L212,195 L308,195 L320,115" fill="none" stroke="#1f2a44" stroke-width="2.5"/><rect x="210" y="171" width="100" height="20" fill="#fbfbf7" stroke="#5b6573" stroke-dasharray="3 3"/><rect x="210" y="177" width="100" height="14" fill="#cfe6f3" opacity=".8"/><ellipse cx="222" cy="167" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="244" cy="167" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="266" cy="167" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="288" cy="167" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><rect x="188" y="75" width="144" height="128" rx="6" fill="none" stroke="#1f2a44" stroke-width="2" stroke-dasharray="8 5"/><text x="260" y="240" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">室温（箱で暗くする）</text><path d="M390,115 L402,195 L498,195 L510,115" fill="none" stroke="#1f2a44" stroke-width="2.5"/><rect x="400" y="171" width="100" height="20" fill="#fbfbf7" stroke="#5b6573" stroke-dasharray="3 3"/><rect x="400" y="177" width="100" height="14" fill="#cfe6f3" opacity=".8"/><ellipse cx="412" cy="167" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="434" cy="167" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="456" cy="167" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="478" cy="167" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><text x="450" y="240" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">空気にふれる</text><path d="M560,115 L572,195 L668,195 L680,115" fill="none" stroke="#1f2a44" stroke-width="2.5"/><rect x="570" y="171" width="100" height="20" fill="#fbfbf7" stroke="#5b6573" stroke-dasharray="3 3"/><path d="M565,135 L572,195 L668,195 L675,135 z" fill="#cfe6f3" opacity=".8"/><ellipse cx="582" cy="175" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="604" cy="175" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="626" cy="175" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><ellipse cx="648" cy="175" rx="9" ry="6" fill="#c7a27a" stroke="#1f2a44" stroke-width="1.2"/><text x="620" y="240" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">水にしずめる</text><text x="360" y="280" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">温度を比べるときは明るさもそろえる（冷蔵庫の中は暗いので、室温のものに箱をかぶせる）</text>
</svg>