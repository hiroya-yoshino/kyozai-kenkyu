<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" role="img" aria-label="水よう液を加熱して水をじょう発させる手順" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>水よう液を加熱して水をじょう発させる手順</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="356" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">水よう液から水をじょう発させる</text><rect x="140" y="250" width="220" height="60" rx="8" fill="#dde3ea" stroke="#1f2a44" stroke-width="2"/><path d="M230,250 q20,-30 40,0" fill="#ffd166" stroke="#e08a00" stroke-width="1.5"/><rect x="170" y="226" width="160" height="8" fill="none" stroke="#5b6573" stroke-width="2"/><text x="150" y="230" font-size="12" fill="#5b6573" text-anchor="end" font-weight="normal">金あみ</text><path d="M200,212 Q250,240 300,212 z" fill="#eef1f4" stroke="#1f2a44" stroke-width="2"/><rect x="236" y="214" width="5" height="5" fill="#fff" stroke="#5b6573"/><rect x="248" y="214" width="5" height="5" fill="#fff" stroke="#5b6573"/><rect x="262" y="214" width="5" height="5" fill="#fff" stroke="#5b6573"/><text x="250" y="196" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">じょう発皿</text><path d="M232,190 q-6,-14 2,-26 M254,186 q-6,-14 2,-26 M276,190 q-6,-14 2,-26" fill="none" stroke="#9cc7e6" stroke-width="2"/><text x="250" y="140" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">水じょう気</text><text x="250" y="336" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">実験用ガスこんろ（弱火）</text><text x="420" y="120" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">1　じょう発皿に水よう液を少量とる</text><text x="420" y="152" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">2　弱火でゆっくり熱する</text><text x="420" y="184" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">3　少し液が残るうちに火を止める</text><text x="420" y="216" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">4　余熱で水をじょう発させる</text><text x="420" y="248" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">5　残ったつぶを虫めがねで見る</text><text x="420" y="300" font-size="13" fill="#c8372d" text-anchor="start" font-weight="bold">真上から顔をのぞきこまない</text><text x="420" y="320" font-size="12" fill="#c8372d" text-anchor="start" font-weight="normal">（液がはねることがある）</text>
</svg>