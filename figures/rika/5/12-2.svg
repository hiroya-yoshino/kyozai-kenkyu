<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="アブラナのくきについたつぼみ・花・実と、実の中の種子" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>アブラナのくきについたつぼみ・花・実と、実の中の種子</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="380" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">アブラナのくきの上から下へ（つぼみ・花・実）</text><path d="M140,60 L140,360" stroke="#4f8a3c" stroke-width="6"/><ellipse cx="160" cy="80" rx="10" ry="14" fill="#bcd99a" stroke="#4f8a3c" stroke-width="2"/><line x1="146" y1="80" x2="140" y2="80" stroke="#4f8a3c" stroke-width="3"/><text x="300" y="85" font-size="15" fill="#1f2a44" text-anchor="start" font-weight="bold">つぼみ</text><ellipse cx="188.0" cy="140.0" rx="16" ry="10" transform="rotate(0 188.0 140.0)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="170.0" cy="158.0" rx="16" ry="10" transform="rotate(90 170.0 158.0)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="152.0" cy="140.0" rx="16" ry="10" transform="rotate(180 152.0 140.0)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><ellipse cx="170.0" cy="122.0" rx="16" ry="10" transform="rotate(270 170.0 122.0)" fill="#f6d34a" stroke="#b8921a" stroke-width="2"/><circle cx="170" cy="140" r="5" fill="#4f8a3c"/><line x1="146" y1="140" x2="140" y2="140" stroke="#4f8a3c" stroke-width="3"/><text x="300" y="145" font-size="15" fill="#1f2a44" text-anchor="start" font-weight="bold">さいている花</text><path d="M146,210 L210,180" stroke="#9cc66b" stroke-width="7" stroke-linecap="round"/><line x1="146" y1="210" x2="140" y2="210" stroke="#4f8a3c" stroke-width="3"/><text x="300" y="215" font-size="15" fill="#1f2a44" text-anchor="start" font-weight="bold">花びらが落ちた</text><path d="M146,290 L250,250" stroke="#9cc66b" stroke-width="11" stroke-linecap="round"/><line x1="146" y1="290" x2="140" y2="290" stroke="#4f8a3c" stroke-width="3"/><text x="300" y="295" font-size="15" fill="#1f2a44" text-anchor="start" font-weight="bold">細長い実</text><path d="M270,70 L270,300" stroke="#5b6573" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><text x="282" y="340" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">下ほど、早くさいた花</text><rect x="470" y="150" width="200" height="40" rx="20" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="2.5"/><circle cx="495" cy="170" r="7" fill="#8a6b3a"/><circle cx="520" cy="170" r="7" fill="#8a6b3a"/><circle cx="545" cy="170" r="7" fill="#8a6b3a"/><circle cx="570" cy="170" r="7" fill="#8a6b3a"/><circle cx="595" cy="170" r="7" fill="#8a6b3a"/><circle cx="620" cy="170" r="7" fill="#8a6b3a"/><circle cx="645" cy="170" r="7" fill="#8a6b3a"/><text x="570" y="220" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">実を切ると、中に種子がある</text><text x="570" y="132" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">細長い実（めしべのもとが育ったもの）</text>
</svg>