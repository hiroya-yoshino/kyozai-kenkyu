<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="メスシリンダーで水50mLをはかりとるときの目もりの読み方" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>メスシリンダーで水50mLをはかりとるときの目もりの読み方</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="330" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">メスシリンダーの目もりの読み方</text><rect x="120" y="60" width="90" height="240" fill="none" stroke="#1f2a44" stroke-width="2.5"/><path d="M122,182 Q165,198 208,182 L208,298 L122,298 z" fill="#cfe6f3"/><line x1="180" y1="120" x2="208" y2="120" stroke="#1f2a44" stroke-width="1.5"/><line x1="194" y1="134" x2="208" y2="134" stroke="#1f2a44" stroke-width="1.5"/><line x1="194" y1="148" x2="208" y2="148" stroke="#1f2a44" stroke-width="1.5"/><line x1="194" y1="162" x2="208" y2="162" stroke="#1f2a44" stroke-width="1.5"/><line x1="194" y1="176" x2="208" y2="176" stroke="#1f2a44" stroke-width="1.5"/><line x1="180" y1="190" x2="208" y2="190" stroke="#1f2a44" stroke-width="1.5"/><line x1="194" y1="204" x2="208" y2="204" stroke="#1f2a44" stroke-width="1.5"/><line x1="194" y1="218" x2="208" y2="218" stroke="#1f2a44" stroke-width="1.5"/><line x1="194" y1="232" x2="208" y2="232" stroke="#1f2a44" stroke-width="1.5"/><line x1="194" y1="246" x2="208" y2="246" stroke="#1f2a44" stroke-width="1.5"/><line x1="180" y1="260" x2="208" y2="260" stroke="#1f2a44" stroke-width="1.5"/><text x="222" y="124" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">55</text><text x="222" y="194" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">50</text><text x="222" y="264" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">45</text><line x1="40" y1="190" x2="120" y2="190" stroke="#1e7f6e" stroke-width="2" stroke-dasharray="4 3"/><circle cx="38" cy="190" r="10" fill="#fff" stroke="#1f2a44" stroke-width="2"/><circle cx="40" cy="190" r="4" fill="#1f2a44"/><text x="14" y="214" font-size="12" fill="#1e7f6e" text-anchor="start" font-weight="normal">目の高さを液面に</text><text x="14" y="230" font-size="12" fill="#1e7f6e" text-anchor="start" font-weight="normal">合わせる</text><text x="330" y="166" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">へこんだ液面の下のところを読む</text><line x1="326" y1="160" x2="200" y2="190" stroke="#5b6573"/><text x="330" y="190" font-size="14" fill="#1e7f6e" text-anchor="start" font-weight="bold">→ この図は 50mL</text><text x="330" y="240" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">1　水平な所に置く</text><text x="330" y="266" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">2　目もりより少し少なめに水を入れる</text><text x="330" y="292" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="normal">3　スポイトで少しずつ入れて合わせる</text>
</svg>