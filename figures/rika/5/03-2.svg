<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="かいぼうけんび鏡のつくりとメダカの卵の観察の手順" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>かいぼうけんび鏡のつくりとメダカの卵の観察の手順</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="340" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">かいぼうけんび鏡でメダカの卵を観察する</text><rect x="120" y="270" width="200" height="22" rx="4" fill="#cfd6df" stroke="#1f2a44" stroke-width="2"/><rect x="205" y="120" width="30" height="150" fill="#dde3ea" stroke="#1f2a44" stroke-width="2"/><rect x="130" y="190" width="170" height="14" fill="#eef1f4" stroke="#1f2a44" stroke-width="2"/><text x="320" y="202" font-size="13" fill="#5b6573" text-anchor="start" font-weight="normal">ステージ</text><rect x="150" y="110" width="90" height="16" fill="#dde3ea" stroke="#1f2a44" stroke-width="2"/><rect x="150" y="96" width="20" height="30" fill="#1f2a44"/><text x="140" y="92" font-size="13" fill="#5b6573" text-anchor="end" font-weight="normal">レンズ</text><ellipse cx="205" cy="186" rx="34" ry="6" fill="#cfe6f3" stroke="#1f2a44" stroke-width="1.5"/><text x="120" y="172" font-size="12" fill="#5b6573" text-anchor="end" font-weight="normal">ペトリ皿</text><line x1="124" y1="174" x2="176" y2="184" stroke="#5b6573"/><circle cx="250" cy="160" r="12" fill="#eef1f4" stroke="#1f2a44" stroke-width="2"/><text x="268" y="152" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">調節ねじ</text><path d="M170,250 l40,0 l-20,20 z" fill="#eef1f4" stroke="#1f2a44" stroke-width="2"/><text x="160" y="262" font-size="12" fill="#5b6573" text-anchor="end" font-weight="normal">反しゃ鏡</text><text x="380" y="120" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">1　卵を水草ごと、水を入れたペトリ皿に移す</text><text x="380" y="154" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">2　ステージにのせ、反しゃ鏡で明るくする</text><text x="380" y="188" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">3　横から見ながらレンズを卵に近づける</text><text x="380" y="222" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">4　のぞきながら、調節ねじでピントを合わせる</text><text x="380" y="256" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">5　観察後は卵をすぐ水そうにもどす</text><text x="360" y="320" font-size="13" fill="#c8372d" text-anchor="middle" font-weight="bold">直射日光の当たらない、明るい場所で使う</text>
</svg>