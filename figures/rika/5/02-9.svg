<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-label="日光や肥料の条件を変えたインゲンマメのなえの育ち方" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>日光や肥料の条件を変えたインゲンマメのなえの育ち方</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="450" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">日光や肥料と植物の成長（1〜2週間後）</text><circle cx="190" cy="80" r="14" fill="#ffd166" stroke="#e08a00"/><line x1="130" y1="280" x2="130" y2="110" stroke="#4f8a3c" stroke-width="4"/><ellipse cx="112" cy="260" rx="16" ry="8" transform="rotate(20 112 260)" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="1.5"/><ellipse cx="148" cy="235" rx="16" ry="8" transform="rotate(-20 148 235)" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="1.5"/><ellipse cx="112" cy="210" rx="16" ry="8" transform="rotate(20 112 210)" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="1.5"/><ellipse cx="148" cy="185" rx="16" ry="8" transform="rotate(-20 148 185)" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="1.5"/><ellipse cx="112" cy="160" rx="16" ry="8" transform="rotate(20 112 160)" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="1.5"/><ellipse cx="148" cy="135" rx="16" ry="8" transform="rotate(-20 148 135)" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="1.5"/><path d="M90,280 h80 l-8,40 h-64 z" fill="#d9b38c" stroke="#1f2a44" stroke-width="2"/><text x="130" y="350" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">ア　日光：当てる</text><text x="130" y="372" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">肥料：あたえる</text><text x="130" y="398" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">よく育つ</text><circle cx="420" cy="80" r="14" fill="#ffd166" stroke="#e08a00"/><line x1="360" y1="280" x2="360" y2="170" stroke="#4f8a3c" stroke-width="4"/><ellipse cx="342" cy="260" rx="16" ry="8" transform="rotate(20 342 260)" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="1.5"/><ellipse cx="378" cy="238" rx="16" ry="8" transform="rotate(-20 378 238)" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="1.5"/><ellipse cx="342" cy="215" rx="16" ry="8" transform="rotate(20 342 215)" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="1.5"/><ellipse cx="378" cy="192" rx="16" ry="8" transform="rotate(-20 378 192)" fill="#cfe6bf" stroke="#4f8a3c" stroke-width="1.5"/><path d="M320,280 h80 l-8,40 h-64 z" fill="#d9b38c" stroke="#1f2a44" stroke-width="2"/><text x="360" y="350" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">イ　日光：当てる</text><text x="360" y="372" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">肥料：あたえない</text><text x="360" y="398" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="bold">アほど育たない</text><rect x="520" y="80" width="140" height="240" rx="6" fill="none" stroke="#1f2a44" stroke-width="2" stroke-dasharray="8 5"/><text x="590" y="74" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">箱をかぶせる</text><line x1="590" y1="280" x2="590" y2="100" stroke="#4f8a3c" stroke-width="2.5"/><ellipse cx="572" cy="260" rx="10" ry="8" transform="rotate(20 572 260)" fill="#f2f0c9" stroke="#4f8a3c" stroke-width="1.5"/><ellipse cx="608" cy="207" rx="10" ry="8" transform="rotate(-20 608 207)" fill="#f2f0c9" stroke="#4f8a3c" stroke-width="1.5"/><ellipse cx="572" cy="153" rx="10" ry="8" transform="rotate(20 572 153)" fill="#f2f0c9" stroke="#4f8a3c" stroke-width="1.5"/><path d="M550,280 h80 l-8,40 h-64 z" fill="#d9b38c" stroke="#1f2a44" stroke-width="2"/><text x="590" y="350" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">ウ　日光：当てない</text><text x="590" y="372" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">肥料：あたえる</text><text x="590" y="398" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="bold">葉が黄色く、ひょろ長い</text><text x="360" y="430" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">土は肥料をふくまないもの（バーミキュライトなど）を使い、水は同じ量をあたえる</text>
</svg>