<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-label="メダカのおすとめすのせびれ・しりびれのちがい" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>メダカのおすとめすのせびれ・しりびれのちがい</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="310" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">メダカのおすとめすの見分け方</text><text x="190" y="70" font-size="18" fill="#1f2a44" text-anchor="middle" font-weight="bold">おす</text><text x="530" y="70" font-size="18" fill="#1f2a44" text-anchor="middle" font-weight="bold">めす</text><path d="M256.4,150 l31.200000000000003,-20.8 l0,41.6 z" fill="#f3e3c3" stroke="#1f2a44" stroke-width="2"/><path d="M90,150 q78.0,-33.800000000000004 169.0,0 q-91.0,33.800000000000004 -169.0,0 z" fill="#f3e3c3" stroke="#1f2a44" stroke-width="2"/><path d="M201.8,131.8 l18.2,-15.600000000000001 l13.0,13.0" fill="#f3e3c3" stroke="#c8372d" stroke-width="2.5"/><line x1="214.8" y1="121.4" x2="220.0" y2="126.6" stroke="#c8372d" stroke-width="2"/><path d="M168.0,165.6 L175.8,183.8 L240.8,173.4 L235.6,160.4" fill="#f3e3c3" stroke="#c8372d" stroke-width="2.5"/><circle cx="116.0" cy="146.1" r="5.2" fill="#1f2a44"/><path d="M596.4,150 l31.200000000000003,-20.8 l0,41.6 z" fill="#f3e3c3" stroke="#1f2a44" stroke-width="2"/><path d="M430,150 q78.0,-33.800000000000004 169.0,0 q-91.0,33.800000000000004 -169.0,0 z" fill="#f3e3c3" stroke="#1f2a44" stroke-width="2"/><path d="M544.4,133.1 l18.2,-13.0 l10.4,10.4" fill="#f3e3c3" stroke="#c8372d" stroke-width="2.5"/><path d="M528.8,163.0 L536.6,176.0 L575.6,170.8 L573.0,160.4" fill="#f3e3c3" stroke="#c8372d" stroke-width="2.5"/><circle cx="456.0" cy="146.1" r="5.2" fill="#1f2a44"/><text x="190" y="230" font-size="14" fill="#c8372d" text-anchor="middle" font-weight="bold">せびれに切れこみがある</text><text x="190" y="252" font-size="14" fill="#c8372d" text-anchor="middle" font-weight="bold">しりびれが平行四辺形に近く、大きい</text><text x="530" y="230" font-size="14" fill="#c8372d" text-anchor="middle" font-weight="bold">せびれに切れこみがない</text><text x="530" y="252" font-size="14" fill="#c8372d" text-anchor="middle" font-weight="bold">しりびれのうしろが短い</text><text x="360" y="290" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">赤い線のひれ（せびれ・しりびれ）の形で見分ける</text>
</svg>