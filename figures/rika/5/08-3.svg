<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" role="img" aria-label="食塩を水にとかす前と後の重さを電子てんびんで比べる" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>食塩を水にとかす前と後の重さを電子てんびんで比べる</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="334" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">食塩をとかす前と後の重さを比べる</text><text x="190" y="62" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">とかす前</text><path d="M140,110 L140,190 L220,190 L220,110" fill="none" stroke="#1f2a44" stroke-width="2.5"/><rect x="142" y="140" width="76" height="48" fill="#cfe6f3"/><rect x="136" y="102" width="88" height="8" rx="2" fill="#1f2a44"/><path d="M232,186 l40,0 l-6,-8 l-28,0 z" fill="#fff" stroke="#1f2a44" stroke-width="1.5"/><rect x="242" y="172" width="5" height="5" fill="#eee" stroke="#5b6573"/><rect x="250" y="172" width="5" height="5" fill="#eee" stroke="#5b6573"/><rect x="258" y="172" width="5" height="5" fill="#eee" stroke="#5b6573"/><text x="256" y="166" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">食塩</text><rect x="120" y="200" width="160" height="40" rx="6" fill="#dde3ea" stroke="#1f2a44" stroke-width="2"/><rect x="130" y="192" width="140" height="8" rx="2" fill="#c3cbd5" stroke="#1f2a44" stroke-width="1.5"/><rect x="162" y="212" width="76" height="20" fill="#1f2a44"/><text x="200" y="228" font-size="14" fill="#7ee0a8" text-anchor="middle" font-weight="bold">105.0 g</text><text x="200" y="272" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">水＋容器＋食塩＋薬包紙</text><text x="530" y="62" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">とかした後</text><path d="M480,110 L480,190 L560,190 L560,110" fill="none" stroke="#1f2a44" stroke-width="2.5"/><rect x="482" y="140" width="76" height="48" fill="#cfe6f3"/><rect x="476" y="102" width="88" height="8" rx="2" fill="#1f2a44"/><path d="M572,186 l40,0 l-6,-8 l-28,0 z" fill="#fff" stroke="#1f2a44" stroke-width="1.5"/><rect x="460" y="200" width="160" height="40" rx="6" fill="#dde3ea" stroke="#1f2a44" stroke-width="2"/><rect x="470" y="192" width="140" height="8" rx="2" fill="#c3cbd5" stroke="#1f2a44" stroke-width="1.5"/><rect x="502" y="212" width="76" height="20" fill="#1f2a44"/><text x="540" y="228" font-size="14" fill="#7ee0a8" text-anchor="middle" font-weight="bold">105.0 g</text><text x="540" y="272" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">食塩水＋容器＋薬包紙</text><path d="M300,150 L420,150" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><text x="360" y="138" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">よくふって</text><text x="360" y="172" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">とかす</text><text x="360" y="314" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">とかす前と後で、全体の重さは変わらない（数値は例）</text>
</svg>