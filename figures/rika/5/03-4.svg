<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 295" role="img" aria-label="メダカの卵が受精してからかえるまでの育ちの目安" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>メダカの卵が受精してからかえるまでの育ちの目安</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="295" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">メダカの卵の育ち（水温25℃くらいのときの目安）</text><circle cx="75" cy="120" r="40" fill="#fbf6e6" stroke="#1f2a44" stroke-width="2"/><circle cx="63" cy="112" r="5" fill="#f0dc9c" stroke="#5b6573"/><circle cx="83" cy="106" r="5" fill="#f0dc9c" stroke="#5b6573"/><circle cx="89" cy="126" r="5" fill="#f0dc9c" stroke="#5b6573"/><circle cx="69" cy="132" r="5" fill="#f0dc9c" stroke="#5b6573"/><circle cx="75" cy="120" r="5" fill="#f0dc9c" stroke="#5b6573"/><text x="75" y="190" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">受精直後</text><text x="75" y="214" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">あわのようなものが</text><text x="75" y="232" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">見える</text><path d="M121,120 L177,120" stroke="#5b6573" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><circle cx="227" cy="120" r="40" fill="#fbf6e6" stroke="#1f2a44" stroke-width="2"/><path d="M201,130 q26,-24 52,0" fill="none" stroke="#c49a52" stroke-width="7" stroke-linecap="round"/><text x="227" y="190" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">約2日</text><text x="227" y="214" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">体のもとが</text><text x="227" y="232" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">できてくる</text><path d="M273,120 L329,120" stroke="#5b6573" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><circle cx="379" cy="120" r="40" fill="#fbf6e6" stroke="#1f2a44" stroke-width="2"/><path d="M353,134 q26,-36 52,0" fill="none" stroke="#c49a52" stroke-width="8" stroke-linecap="round"/><circle cx="361" cy="118" r="5" fill="#1f2a44"/><text x="379" y="190" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">約4日</text><text x="379" y="214" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">目がはっきりし</text><text x="379" y="232" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">血液が流れる</text><path d="M425,120 L481,120" stroke="#5b6573" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><circle cx="531" cy="120" r="40" fill="#fbf6e6" stroke="#1f2a44" stroke-width="2"/><path d="M503,126 q28,-40 56,-4 q-10,26 -40,22" fill="none" stroke="#c49a52" stroke-width="9" stroke-linecap="round"/><circle cx="515" cy="110" r="6" fill="#1f2a44"/><circle cx="535" cy="128" r="4" fill="#c8372d"/><text x="531" y="190" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">約8日</text><text x="531" y="214" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">体ができて</text><text x="531" y="232" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">よく動く</text><path d="M692.4,124 l13.200000000000001,-8.8 l0,17.6 z" fill="#f3e3c3" stroke="#1f2a44" stroke-width="2"/><path d="M622,124 q33.0,-14.3 71.5,0 q-38.5,14.3 -71.5,0 z" fill="#f3e3c3" stroke="#1f2a44" stroke-width="2"/><path d="M670.4,116.85 l7.700000000000001,-5.5 l4.4,4.4" fill="#f3e3c3" stroke="#c8372d" stroke-width="2.5"/><path d="M663.8,129.5 L667.1,135.0 L683.6,132.8 L682.5,128.4" fill="#f3e3c3" stroke="#c8372d" stroke-width="2.5"/><circle cx="633.0" cy="122.35" r="2.2" fill="#1f2a44"/><ellipse cx="643" cy="134" rx="10" ry="7" fill="#f6d27a" stroke="#1f2a44" stroke-width="1.5"/><path d="M586,120 L612,120" stroke="#5b6573" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><text x="664" y="190" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">約11日</text><text x="664" y="214" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">かえる</text><text x="664" y="232" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">はらにふくろ</text><text x="360" y="275" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">日数は水温によって変わる。かえった子メダカは、はらのふくろの養分で2〜3日育つ</text>
</svg>