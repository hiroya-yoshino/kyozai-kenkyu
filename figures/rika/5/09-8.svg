<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img" aria-label="電流計を回路に直列につなぐ方法と−たんしの使い方" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>電流計を回路に直列につなぐ方法と−たんしの使い方</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="408" fill="#fff"/>
<text x="360" y="30" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">電流計のつなぎ方</text><rect x="120" y="80" width="480" height="200" rx="16" fill="none" stroke="#1f2a44" stroke-width="3"/><rect x="140" y="150" width="40" height="70" fill="#fff" stroke="#1f2a44" stroke-width="2"/><rect x="150" y="142" width="20" height="8" fill="#1f2a44"/><text x="160" y="240" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">かん電池</text><rect x="280" y="62" width="70" height="36" rx="4" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="315" y="86" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="normal">スイッチ</text><rect x="530" y="140" width="60" height="90" fill="#fff" stroke="none"/><rect x="526" y="173" width="68" height="24" rx="4" fill="#9aa1ab" stroke="#1f2a44" stroke-width="2"/><ellipse cx="540" cy="185" rx="4" ry="15.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="548" cy="185" rx="4" ry="15.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="556" cy="185" rx="4" ry="15.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="564" cy="185" rx="4" ry="15.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="572" cy="185" rx="4" ry="15.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><ellipse cx="580" cy="185" rx="4" ry="15.0" fill="none" stroke="#b8732e" stroke-width="2.5"/><text x="560" y="250" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">電磁石</text><rect x="300" y="244" width="120" height="72" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><path d="M320,290 A40,40 0 0 1 400,290" fill="none" stroke="#5b6573"/><line x1="360" y1="300" x2="380" y2="262" stroke="#c8372d" stroke-width="2"/><text x="360" y="336" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">電流計</text><text x="312" y="310" font-size="13" fill="#c8372d" text-anchor="middle" font-weight="bold">＋</text><text x="412" y="310" font-size="12" fill="#1f2a44" text-anchor="end" font-weight="bold">−（5A）</text><text x="360" y="180" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">電流計は回路に直列につなぐ</text><text x="360" y="372" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">−たんしは、はじめに5Aにつなぎ、はりのふれが小さいときは500mA、50mAにつなぎかえる</text><text x="360" y="392" font-size="12" fill="#c8372d" text-anchor="middle" font-weight="bold">電流計をかん電池だけに直接つないではいけない</text>
</svg>