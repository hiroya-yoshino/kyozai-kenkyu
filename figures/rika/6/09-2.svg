<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" role="img" aria-label="手回し発電機で豆電球やモーターに電気を流す" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>手回し発電機で豆電球やモーターに電気を流す</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="344" fill="#fff"/>
<text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">手回し発電機で電気をつくる</text><rect x="60" y="140" width="110" height="80" rx="14" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><line x1="115" y1="180" x2="115" y2="120" stroke="#1f2a44" stroke-width="5"/><circle cx="115" cy="114" r="8" fill="#1f2a44"/><path d="M80,100 A40,40 0 0 1 150,100" fill="none" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)"/><text x="115" y="188" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="bold">手回し</text><text x="115" y="204" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="bold">発電機</text><path d="M170,160 H300 V150 M170,200 H300 V210" stroke="#c8372d" stroke-width="3" fill="none"/><circle cx="320" cy="160" r="20" fill="#fff3b0" stroke="#1f2a44" stroke-width="2"/><rect x="308" y="178" width="24" height="18" fill="#5b6573"/><line x1="297" y1="149" x2="288" y2="144" stroke="#e0a800" stroke-width="2"/><line x1="304" y1="140" x2="298" y2="132" stroke="#e0a800" stroke-width="2"/><line x1="314" y1="135" x2="312" y2="125" stroke="#e0a800" stroke-width="2"/><line x1="326" y1="135" x2="328" y2="125" stroke="#e0a800" stroke-width="2"/><line x1="336" y1="140" x2="342" y2="132" stroke="#e0a800" stroke-width="2"/><line x1="343" y1="149" x2="352" y2="144" stroke="#e0a800" stroke-width="2"/><text x="320" y="236" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">豆電球が光る</text><rect x="460" y="140" width="80" height="60" rx="10" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><text x="500" y="176" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="bold">モーター</text><ellipse cx="500" cy="120" rx="40" ry="8" fill="#cfe3f3" stroke="#1f2a44"/><line x1="500" y1="140" x2="500" y2="120" stroke="#1f2a44" stroke-width="3"/><text x="500" y="236" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">モーターが回る</text><text x="410" y="176" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">または</text><rect x="60" y="270" width="560" height="60" rx="8" fill="#f4fbf9" stroke="#1e7f6e"/><text x="340" y="294" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">速く回す → 豆電球が明るくなる・モーターが速く回る</text><text x="340" y="316" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">回す向きを逆にする → 電流の向きが逆になり、モーターの回る向きが変わる</text>
</svg>