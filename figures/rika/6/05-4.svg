<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="炭酸水から出てくる気体を石灰水で調べる" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>炭酸水から出てくる気体を石灰水で調べる</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="640" height="340" fill="#fff"/>
<text x="320" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">炭酸水にとけている気体を調べる</text><rect x="80" y="90" width="90" height="200" rx="18" fill="#eef6fb" stroke="#1f2a44" stroke-width="2.5"/><rect x="105" y="66" width="40" height="26" fill="#1f2a44"/><circle cx="95" cy="150" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="124" cy="191" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="153" cy="232" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="122" cy="153" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="151" cy="194" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="120" cy="235" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="149" cy="156" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="118" cy="197" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="147" cy="238" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="116" cy="159" r="4" fill="#fff" stroke="#3b8bc2"/><text x="125" y="315" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">①炭酸水をふる</text><path d="M190,180 L260,180" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="280" y="90" width="90" height="200" rx="18" fill="#f7f9fb" stroke="#1f2a44" stroke-width="2.5"/><rect x="283" y="240" width="84" height="46" fill="#e6e6e6"/><text x="325" y="268" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="bold">白くにごる</text><text x="325" y="315" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">②石灰水を入れてふる</text><rect x="420" y="120" width="190" height="120" rx="10" fill="#f4fbf9" stroke="#1e7f6e" stroke-width="2"/><text x="515" y="150" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">気体検知管でも</text><text x="515" y="172" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">二酸化炭素が多い</text><text x="515" y="210" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">→ 二酸化炭素が</text><text x="515" y="230" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">とけている</text>
</svg>