<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-label="食べる・食べられるの関係（食物連鎖の例）" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>食べる・食べられるの関係（食物連鎖の例）</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="372" fill="#fff"/>
<text x="360" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">食べる・食べられるの関係（食物連鎖の例）</text><text x="40" y="100" font-size="14" fill="#5b6573" text-anchor="start" font-weight="bold">池や川</text><rect x="120" y="70" width="130" height="50" rx="8" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><text x="185.0" y="100.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">植物プランクトン</text><path d="M250,95 L268,95" stroke="#1f2a44" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="270" y="70" width="130" height="50" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="335.0" y="100.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">ミジンコ</text><path d="M400,95 L418,95" stroke="#1f2a44" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="420" y="70" width="130" height="50" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="485.0" y="100.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">メダカ</text><path d="M550,95 L568,95" stroke="#1f2a44" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="570" y="70" width="130" height="50" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="635.0" y="100.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">ザリガニ</text><text x="40" y="230" font-size="14" fill="#5b6573" text-anchor="start" font-weight="bold">草地</text><rect x="120" y="200" width="130" height="50" rx="8" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><text x="185.0" y="230.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">草</text><path d="M250,225 L268,225" stroke="#1f2a44" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="270" y="200" width="130" height="50" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="335.0" y="230.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">バッタ</text><path d="M400,225 L418,225" stroke="#1f2a44" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="420" y="200" width="130" height="50" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="485.0" y="230.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">カエル</text><path d="M550,225 L568,225" stroke="#1f2a44" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="570" y="200" width="130" height="50" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="635.0" y="230.0" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">ヘビ</text><text x="360" y="335" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">→ は「食べられるもの → 食べるもの」の向き</text><text x="360" y="355" font-size="13" fill="#4f8a3c" text-anchor="middle" font-weight="bold">くさりのはじまりは、日光で養分をつくる植物</text>
</svg>