<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="リトマス紙の色の変化と、酸性・中性・アルカリ性の仲間分け" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>リトマス紙の色の変化と、酸性・中性・アルカリ性の仲間分け</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="360" fill="#fff"/>
<text x="360" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">リトマス紙の色の変化と仲間分け</text><rect x="30" y="50" width="210" height="270" rx="10" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="135" y="80" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">酸性</text><text x="135" y="102" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">青→赤に変わる</text><rect x="60" y="120" width="34" height="70" rx="3" fill="#e08f9a" stroke="#1f2a44" stroke-width="1.5"/><text x="77" y="208" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal">青色リトマス紙</text><rect x="150" y="120" width="34" height="70" rx="3" fill="#e08f9a" stroke="#1f2a44" stroke-width="1.5"/><text x="167" y="208" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal">赤色リトマス紙</text><text x="135" y="270" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">例</text><text x="135" y="292" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">うすい塩酸・炭酸水</text><rect x="260" y="50" width="210" height="270" rx="10" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="365" y="80" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">中性</text><text x="365" y="102" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">どちらも変わらない</text><rect x="290" y="120" width="34" height="70" rx="3" fill="#7fa6d9" stroke="#1f2a44" stroke-width="1.5"/><text x="307" y="208" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal">青色リトマス紙</text><rect x="380" y="120" width="34" height="70" rx="3" fill="#e08f9a" stroke="#1f2a44" stroke-width="1.5"/><text x="397" y="208" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal">赤色リトマス紙</text><text x="365" y="270" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">例</text><text x="365" y="292" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">食塩水</text><rect x="490" y="50" width="210" height="270" rx="10" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="595" y="80" font-size="17" fill="#1f2a44" text-anchor="middle" font-weight="bold">アルカリ性</text><text x="595" y="102" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">赤→青に変わる</text><rect x="520" y="120" width="34" height="70" rx="3" fill="#7fa6d9" stroke="#1f2a44" stroke-width="1.5"/><text x="537" y="208" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal">青色リトマス紙</text><rect x="610" y="120" width="34" height="70" rx="3" fill="#7fa6d9" stroke="#1f2a44" stroke-width="1.5"/><text x="627" y="208" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal">赤色リトマス紙</text><text x="595" y="270" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">例</text><text x="595" y="292" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">石灰水・アンモニア水</text><text x="360" y="345" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">リトマス紙はピンセットで持ち、ガラス棒で1てきつける。1つ調べるごとにガラス棒を洗う</text>
</svg>