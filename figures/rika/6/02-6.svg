<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-label="血液のじゅんかんの模式図" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>血液のじゅんかんの模式図</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="640" height="460" fill="#fff"/>
<defs><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8372d"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/></marker></defs><text x="320" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">血液のじゅんかん（模式図）</text><rect x="250" y="60" width="140" height="50" rx="8" fill="#fbecea" stroke="#1f2a44" stroke-width="2"/><text x="320.0" y="82.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">肺</text><text x="320.0" y="102.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">酸素を受けとる</text><rect x="250" y="200" width="140" height="56" rx="8" fill="#fff" stroke="#c8372d" stroke-width="2"/><text x="320.0" y="225.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">心臓</text><text x="320.0" y="245.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">ポンプで送り出す</text><rect x="250" y="350" width="140" height="56" rx="8" fill="#f7f9fb" stroke="#1f2a44" stroke-width="2"/><text x="320.0" y="375.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">全身</text><text x="320.0" y="395.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">酸素・養分をわたす</text><path d="M290,200 L290,114" stroke="#5b6573" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrS)"/><path d="M350,110 L350,196" stroke="#c8372d" stroke-width="3" marker-end="url(#arrR)"/><path d="M350,256 L350,346" stroke="#c8372d" stroke-width="3" marker-end="url(#arrR)"/><path d="M290,350 L290,260" stroke="#5b6573" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrS)"/><line x1="430" y1="420" x2="470" y2="420" stroke="#c8372d" stroke-width="3"/><text x="478" y="425" font-size="12" fill="#1f2a44" text-anchor="start" font-weight="normal">酸素が多い血液</text><line x1="430" y1="442" x2="470" y2="442" stroke="#5b6573" stroke-width="3" stroke-dasharray="7 5"/><text x="478" y="447" font-size="12" fill="#1f2a44" text-anchor="start" font-weight="normal">二酸化炭素が多い血液</text><text x="30" y="230" font-size="13" fill="#5b6573" text-anchor="start" font-weight="normal">脈はく：心臓が</text><text x="30" y="248" font-size="13" fill="#5b6573" text-anchor="start" font-weight="normal">血液を送り出す</text><text x="30" y="266" font-size="13" fill="#5b6573" text-anchor="start" font-weight="normal">ときの動きが</text><text x="30" y="284" font-size="13" fill="#5b6573" text-anchor="start" font-weight="normal">血管に伝わる</text>
</svg>