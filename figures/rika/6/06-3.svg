<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="電灯とボールを使って月の見え方を調べるモデル実験" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>電灯とボールを使って月の見え方を調べるモデル実験</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="760" height="380" fill="#fff"/>
<text x="320" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">電灯とボールのモデル実験</text><rect x="20" y="170" width="60" height="60" rx="6" fill="#ffd166" stroke="#e08a00" stroke-width="2"/><text x="50" y="254" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="bold">電灯（太陽）</text><line x1="84" y1="180" x2="160" y2="150" stroke="#ffd166" stroke-width="2"/><line x1="84" y1="190" x2="160" y2="175" stroke="#ffd166" stroke-width="2"/><line x1="84" y1="200" x2="160" y2="200" stroke="#ffd166" stroke-width="2"/><line x1="84" y1="210" x2="160" y2="225" stroke="#ffd166" stroke-width="2"/><line x1="84" y1="220" x2="160" y2="250" stroke="#ffd166" stroke-width="2"/><circle cx="360" cy="200" r="34" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><text x="360" y="206" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">自分</text><text x="360" y="252" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">（地球）</text><circle cx="360" cy="200" r="130" fill="none" stroke="#5b6573" stroke-dasharray="6 5"/><circle cx="230" cy="200" r="18" fill="#5b6573"/><path d="M230,182 A18,18 0 0 0 230,218 z" fill="#fff3b0"/><circle cx="360" cy="70" r="18" fill="#5b6573"/><path d="M360,52 A18,18 0 0 0 360,88 z" fill="#fff3b0"/><circle cx="490" cy="200" r="18" fill="#5b6573"/><path d="M490,182 A18,18 0 0 0 490,218 z" fill="#fff3b0"/><circle cx="360" cy="330" r="18" fill="#5b6573"/><path d="M360,312 A18,18 0 0 0 360,348 z" fill="#fff3b0"/><text x="360" y="52" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">ボール（月）を持って、自分のまわりを回す</text><text x="520" y="200" font-size="13" fill="#1f2a44" text-anchor="start" font-weight="bold">見え方</text><circle cx="530" cy="240" r="16" fill="#5b6573"/><circle cx="530" cy="240" r="16" fill="none" stroke="#5b6573"/><text x="556" y="245" font-size="12" fill="#1f2a44" text-anchor="start" font-weight="normal">電灯の方：見えない（新月）</text><circle cx="530" cy="286" r="16" fill="#5b6573"/><path d="M530,270 A16,16 0 0 1 530,302 A0.0,16 0 0 0 530,270 z" fill="#fff3b0" stroke="#5b6573" stroke-width="1"/><text x="556" y="291" font-size="12" fill="#1f2a44" text-anchor="start" font-weight="normal">横：半分光る（半月）</text><circle cx="530" cy="332" r="16" fill="#5b6573"/><path d="M530,316 A16,16 0 0 0 530,348 A16.0,16 0 0 0 530,316 z" fill="#fff3b0" stroke="#5b6573" stroke-width="1"/><text x="556" y="337" font-size="12" fill="#1f2a44" text-anchor="start" font-weight="normal">反対側：まるく光る（満月）</text>
</svg>