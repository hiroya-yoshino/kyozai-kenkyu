<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-label="人感センサーで明かりをつけたり消したりするプログラムのフローチャート" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>人感センサーで明かりをつけたり消したりするプログラムのフローチャート</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="420" fill="#fff"/>
<text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">人が近づくと明かりがつくプログラムの流れ</text><rect x="270" y="50" width="140" height="40" rx="20" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="340" y="75" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">はじめ</text><path d="M340,90 L340,116" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><polygon points="340,118 450,170 340,222 230,170" fill="#f4fbf9" stroke="#1e7f6e" stroke-width="2"/><text x="340" y="166" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">人が</text><text x="340" y="184" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">いるか？</text><path d="M340,222 V250" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)"/><text x="352" y="242" font-size="12" fill="#1e7f6e" text-anchor="start" font-weight="bold">はい</text><rect x="260" y="252" width="160" height="44" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="340.0" y="279.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">明かりをつける</text><path d="M340,296 L340,320" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="260" y="322" width="160" height="44" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="340.0" y="349.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">10秒待つ</text><path d="M450,170 H560 V384 H340 V366" fill="none" stroke="#1f2a44" stroke-width="2.5"/><text x="470" y="160" font-size="12" fill="#c8372d" text-anchor="start" font-weight="bold">いいえ</text><path d="M560,170 H560" stroke="none"/><rect x="480" y="210" width="160" height="44" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="560.0" y="237.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">明かりを消す</text><path d="M340,384 V400 H120 V170 H228" fill="none" stroke="#5b6573" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="124" y="290" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">くり返す</text>
</svg>