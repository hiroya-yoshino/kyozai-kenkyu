<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="だ液によるでんぷんの変化を調べる実験" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>だ液によるでんぷんの変化を調べる実験</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="400" fill="#fff"/>
<text x="360" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">だ液によるでんぷんの変化を調べる</text><rect x="40" y="120" width="250" height="150" rx="6" fill="url(#water)" stroke="#1f2a44" stroke-width="2.5"/><text x="165" y="292" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">約40℃の湯（体温に近い温度）</text><path d="M95,70 L95,220 a16,16 0 0 0 32,0 L127,70" fill="none" stroke="#1f2a44" stroke-width="2.5"/><path d="M97,140 L97,220 a14,14 0 0 0 28,0 L125,140 z" fill="#fffbe6"/><text x="111" y="60" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">A</text><path d="M205,70 L205,220 a16,16 0 0 0 32,0 L237,70" fill="none" stroke="#1f2a44" stroke-width="2.5"/><path d="M207,140 L207,220 a14,14 0 0 0 28,0 L235,140 z" fill="#fffbe6"/><text x="221" y="60" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">B</text><text x="111" y="340" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="normal">でんぷん液</text><text x="111" y="356" font-size="12" fill="#1e7f6e" text-anchor="middle" font-weight="bold">＋だ液</text><text x="221" y="340" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="normal">でんぷん液</text><text x="221" y="356" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="bold">＋水</text><path d="M310,190 L400,190" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><text x="355" y="172" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">数分後</text><text x="355" y="215" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">ヨウ素液</text><text x="355" y="231" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">を入れる</text><path d="M450,70 L450,220 a16,16 0 0 0 32,0 L482,70" fill="none" stroke="#1f2a44" stroke-width="2.5"/><path d="M452,140 L452,220 a14,14 0 0 0 28,0 L480,140 z" fill="#fffbe6"/><text x="466" y="60" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">A</text><path d="M570,70 L570,220 a16,16 0 0 0 32,0 L602,70" fill="none" stroke="#1f2a44" stroke-width="2.5"/><path d="M572,140 L572,220 a14,14 0 0 0 28,0 L600,140 z" fill="#3b5ba5"/><text x="586" y="60" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">B</text><rect x="420" y="300" width="96" height="44" rx="8" fill="#e3f1ee"/><text x="468" y="320" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">色は</text><text x="468" y="337" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">変わらない</text><rect x="540" y="300" width="96" height="44" rx="8" fill="#e8ecf6"/><text x="588" y="320" font-size="13" fill="#3b5ba5" text-anchor="middle" font-weight="bold">青むらさき色</text><text x="588" y="337" font-size="13" fill="#3b5ba5" text-anchor="middle" font-weight="bold">に変わる</text><text x="360" y="382" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">A：でんぷんがだ液で別のものに変わった　B：でんぷんが残っている</text>
</svg>