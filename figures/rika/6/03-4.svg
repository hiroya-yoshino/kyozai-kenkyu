<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="植物にふくろをかぶせて日光に当て、気体の出入りを調べる" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>植物にふくろをかぶせて日光に当て、気体の出入りを調べる</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="400" fill="#fff"/>
<text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">植物の気体の出入りを調べる（日光に当てる）</text><path d="M80,330 h80 l-10,40 h-60 z" fill="#d9b38c" stroke="#1f2a44" stroke-width="2"/><line x1="120" y1="330" x2="120" y2="150" stroke="#4f8a3c" stroke-width="5"/><ellipse cx="145" cy="170" rx="26" ry="12" transform="rotate(25 145 170)" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><ellipse cx="95" cy="205" rx="26" ry="12" transform="rotate(-25 95 205)" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><ellipse cx="145" cy="240" rx="26" ry="12" transform="rotate(25 145 240)" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><ellipse cx="95" cy="275" rx="26" ry="12" transform="rotate(-25 95 275)" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><path d="M120,120 C50,130 50,300 90,310 L150,310 C190,300 190,130 120,120 z" fill="none" stroke="#5b6573" stroke-width="2" stroke-dasharray="5 4"/><circle cx="300" cy="80" r="24" fill="#ffd166" stroke="#e08a00" stroke-width="2"/><line x1="332" y1="80" x2="342" y2="80" stroke="#e08a00" stroke-width="3"/><line x1="323" y1="103" x2="330" y2="110" stroke="#e08a00" stroke-width="3"/><line x1="300" y1="112" x2="300" y2="122" stroke="#e08a00" stroke-width="3"/><line x1="277" y1="103" x2="270" y2="110" stroke="#e08a00" stroke-width="3"/><line x1="268" y1="80" x2="258" y2="80" stroke="#e08a00" stroke-width="3"/><line x1="277" y1="57" x2="270" y2="50" stroke="#e08a00" stroke-width="3"/><line x1="300" y1="48" x2="300" y2="38" stroke="#e08a00" stroke-width="3"/><line x1="323" y1="57" x2="330" y2="50" stroke="#e08a00" stroke-width="3"/><text x="300" y="132" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">日光</text><text x="420" y="190" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">はじめ</text><text x="560" y="190" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">約1時間後</text><text x="320" y="220" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">酸素</text><text x="420" y="220" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">約16%</text><text x="560" y="220" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">約20%</text><line x1="310" y1="232" x2="640" y2="232" stroke="#dce6ee"/><text x="320" y="256" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">二酸化炭素</text><text x="420" y="256" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">約3%</text><text x="560" y="256" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">約1%</text><line x1="310" y1="268" x2="640" y2="268" stroke="#dce6ee"/><text x="480" y="310" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">息をふきこんだふくろ（数値は目安）</text><text x="480" y="340" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">日光が当たると、二酸化炭素が減り</text><text x="480" y="360" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">酸素がふえる</text>
</svg>