<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="電気が光・音・熱・運動に変わることと電気製品の例" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>電気が光・音・熱・運動に変わることと電気製品の例</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="360" fill="#fff"/>
<text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">電気が変わるものと、電気製品の例</text><circle cx="340" cy="190" r="56" fill="#fff3b0" stroke="#e0a800" stroke-width="3"/><text x="340" y="196" font-size="20" fill="#1f2a44" text-anchor="middle" font-weight="bold">電気</text><rect x="50" y="46" width="180" height="68" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="140.0" y="77.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">光</text><text x="140.0" y="97.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">照明・テレビの画面</text><path d="M290,160 L220,104" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="450" y="46" width="180" height="68" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="540.0" y="77.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">音</text><text x="540.0" y="97.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">スピーカー・ブザー</text><path d="M390,160 L460,104" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="50" y="266" width="180" height="68" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="140.0" y="297.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">熱</text><text x="140.0" y="317.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">アイロン・電気ストーブ</text><path d="M290,220 L220,276" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="450" y="266" width="180" height="68" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="540.0" y="297.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">運動</text><text x="540.0" y="317.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">せん風機・洗たく機</text><path d="M390,220 L460,276" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)" fill="none"/>
</svg>