<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="金属がとけた液を蒸発させて出てきた固体" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>金属がとけた液を蒸発させて出てきた固体</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="640" height="320" fill="#fff"/>
<text x="320" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">金属がとけた液を蒸発させる</text><path d="M120,130 Q170,170 220,130" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><ellipse cx="170" cy="142" rx="22" ry="5" fill="#e7c873" stroke="#5b6573"/><text x="170" y="96" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">鉄がとけた液</text><path d="M130,175 h80 M140,175 l-10,40 M200,175 l10,40" stroke="#1f2a44" stroke-width="2.5"/><path d="M158,170 q12,-30 24,0 z" fill="#7fb3ff"/><text x="170" y="240" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">→ 黄色っぽい固体</text><path d="M420,130 Q470,170 520,130" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><ellipse cx="470" cy="142" rx="22" ry="5" fill="#ffffff" stroke="#5b6573"/><text x="470" y="96" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">アルミニウムがとけた液</text><path d="M430,175 h80 M440,175 l-10,40 M500,175 l10,40" stroke="#1f2a44" stroke-width="2.5"/><path d="M458,170 q12,-30 24,0 z" fill="#7fb3ff"/><text x="470" y="240" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">→ 白い固体</text><text x="320" y="280" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">液が少し残っているうちに火を止め、余熱で蒸発させる</text><text x="320" y="300" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">出てきた固体は、もとの金属と色やつやがちがう</text>
</svg>