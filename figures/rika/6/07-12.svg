<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" role="img" aria-label="地震によって地層がずれてできる断層の模式図" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>地震によって地層がずれてできる断層の模式図</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="336" fill="#fff"/>
<defs>
<pattern id="gravel" width="24" height="16" patternUnits="userSpaceOnUse"><rect width="24" height="16" fill="#e9dcc8"/><circle cx="6" cy="6" r="4" fill="#b8a07e"/><circle cx="17" cy="11" r="3.5" fill="#a88e6a"/></pattern>
<pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3b8"/><circle cx="2" cy="3" r="1" fill="#c9ae6e"/><circle cx="7" cy="7" r="1" fill="#c9ae6e"/></pattern>
<pattern id="mud" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#c9b8a6"/><path d="M0,5 h10" stroke="#a8957f" stroke-width="1"/></pattern>
<pattern id="ash" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#e6e6e6"/><path d="M2,2 l3,2 l-2,3 z" fill="#9aa3ad"/></pattern>
</defs><text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">地震による大地の変化（断層の模式図）</text><path d="M30,70 L150,70 L180,70 L180,110 L30,110 z" fill="url(#mud)" stroke="#1f2a44" stroke-width="1"/><path d="M180,70 L300,70 L300,110 L180,110 z" fill="url(#mud)" stroke="#1f2a44" stroke-width="1"/><path d="M30,110 L150,110 L180,110 L180,150 L30,150 z" fill="url(#sand)" stroke="#1f2a44" stroke-width="1"/><path d="M180,110 L300,110 L300,150 L180,150 z" fill="url(#sand)" stroke="#1f2a44" stroke-width="1"/><path d="M30,150 L150,150 L180,150 L180,190 L30,190 z" fill="url(#ash)" stroke="#1f2a44" stroke-width="1"/><path d="M180,150 L300,150 L300,190 L180,190 z" fill="url(#ash)" stroke="#1f2a44" stroke-width="1"/><path d="M30,190 L150,190 L180,190 L180,230 L30,230 z" fill="url(#gravel)" stroke="#1f2a44" stroke-width="1"/><path d="M180,190 L300,190 L300,230 L180,230 z" fill="url(#gravel)" stroke="#1f2a44" stroke-width="1"/><text x="165" y="270" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">地震の前</text><path d="M360,70 L480,70 L510,70 L510,110 L360,110 z" fill="url(#mud)" stroke="#1f2a44" stroke-width="1"/><path d="M510,100 L630,100 L630,140 L510,140 z" fill="url(#mud)" stroke="#1f2a44" stroke-width="1"/><path d="M360,110 L480,110 L510,110 L510,150 L360,150 z" fill="url(#sand)" stroke="#1f2a44" stroke-width="1"/><path d="M510,140 L630,140 L630,180 L510,180 z" fill="url(#sand)" stroke="#1f2a44" stroke-width="1"/><path d="M360,150 L480,150 L510,150 L510,190 L360,190 z" fill="url(#ash)" stroke="#1f2a44" stroke-width="1"/><path d="M510,180 L630,180 L630,220 L510,220 z" fill="url(#ash)" stroke="#1f2a44" stroke-width="1"/><path d="M360,190 L480,190 L510,190 L510,230 L360,230 z" fill="url(#gravel)" stroke="#1f2a44" stroke-width="1"/><path d="M510,220 L630,220 L630,260 L510,260 z" fill="url(#gravel)" stroke="#1f2a44" stroke-width="1"/><line x1="510" y1="60" x2="510" y2="270" stroke="#c8372d" stroke-width="3"/><text x="530" y="56" font-size="14" fill="#c8372d" text-anchor="start" font-weight="bold">断層</text><text x="495" y="290" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">地震の後：大地がずれる</text><text x="340" y="320" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">地震では、大地に大きな力がはたらいて断層ができ、土地がずれる</text>
</svg>