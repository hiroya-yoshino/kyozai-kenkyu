<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="5種類の水よう液を蒸発させたときの結果" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>5種類の水よう液を蒸発させたときの結果</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="290" fill="#fff"/>
<text x="360" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">水よう液を蒸発させたときの結果</text><path d="M25,110 Q75,150 125,110" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><ellipse cx="75" cy="122" rx="22" ry="5" fill="#ffffff" stroke="#5b6573"/><text x="75" y="76" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">食塩水</text><text x="75" y="180" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">白い固体が残る</text><path d="M167,110 Q217,150 267,110" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><ellipse cx="217" cy="122" rx="22" ry="5" fill="#ffffff" stroke="#5b6573"/><text x="217" y="76" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">石灰水</text><text x="217" y="180" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">白い固体が残る</text><path d="M309,110 Q359,150 409,110" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><text x="359" y="76" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">炭酸水</text><text x="359" y="180" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="bold">何も残らない</text><path d="M451,110 Q501,150 551,110" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><text x="501" y="76" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">うすい塩酸</text><text x="501" y="180" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="bold">何も残らない</text><path d="M593,110 Q643,150 693,110" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><text x="643" y="76" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">うすい</text><text x="643" y="94" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">アンモニア水</text><text x="643" y="180" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="bold">何も残らない</text><rect x="20" y="210" width="680" height="62" rx="8" fill="#f4fbf9" stroke="#1e7f6e"/><text x="360" y="236" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">固体が残る → 固体がとけている（食塩水・石灰水）</text><text x="360" y="258" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">何も残らない → 気体などがとけている（炭酸水・塩酸・アンモニア水）</text>
</svg>