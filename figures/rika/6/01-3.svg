<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" role="img" aria-label="線香のけむりを使って空気の流れを調べるようす" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>線香のけむりを使って空気の流れを調べるようす</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="500" height="380" fill="#fff"/>
<text x="240" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">線香のけむりで空気の流れを見る</text><rect x="130" y="300" width="70" height="22" fill="url(#clay)" stroke="#1f2a44" stroke-width="1.5"/><rect x="240" y="300" width="70" height="22" fill="url(#clay)" stroke="#1f2a44" stroke-width="1.5"/><rect x="200" y="306" width="40" height="16" fill="url(#clay)" stroke="#1f2a44" stroke-width="1.5"/><path d="M190.0,90 L190.0,120 Q150,130 150,160 L150,300 M250.0,90 L250.0,120 Q290,130 290,160 L290,300" fill="none" stroke="#1f2a44" stroke-width="3"/><rect x="212" y="254" width="16" height="52" fill="#fff" stroke="#1f2a44" stroke-width="2"/><line x1="220" y1="254" x2="220" y2="246" stroke="#1f2a44" stroke-width="2"/><ellipse cx="220" cy="234" rx="7" ry="16" fill="#ffd166" stroke="#e08a00" stroke-width="1.5"/><line x1="60" y1="340" x2="110" y2="308" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/><circle cx="110" cy="308" r="3" fill="#c8372d"/><text x="55" y="362" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">火のついた線香</text><path d="M114,304 C145,300 180,290 205,230 S218,150 220,110 L220,56" fill="none" stroke="#5b6573" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="355" y="150" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">けむりは下のすき間から</text><text x="355" y="172" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">入り、ほのおに引きこまれ、</text><text x="355" y="194" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">上の口から出ていく</text><line x1="350" y1="180" x2="260" y2="225" stroke="#5b6573" stroke-width="1"/>
</svg>