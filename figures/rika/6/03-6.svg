<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 416" role="img" aria-label="日光に当てた葉と当てない葉のでんぷんを比べる" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>日光に当てた葉と当てない葉のでんぷんを比べる</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="416" fill="#fff"/>
<text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">日光とでんぷん（ヨウ素液での比べ方）</text><text x="140" y="70" font-size="18" fill="#1f2a44" text-anchor="middle" font-weight="bold">ア</text><text x="140" y="92" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">朝すぐ調べる</text><rect x="110" y="118" width="60" height="24" fill="#c9ced6" stroke="#5b6573"/><text x="140" y="135" font-size="11" fill="#1f2a44" text-anchor="middle" font-weight="normal">はく</text><ellipse cx="140" cy="200" rx="60" ry="30" transform="rotate(0 140 200)" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><path d="M140,240 L140,270" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><ellipse cx="140" cy="310" rx="60" ry="30" transform="rotate(0 140 310)" fill="#f3f8ef" stroke="#4f8a3c" stroke-width="2"/><text x="140" y="370" font-size="14" fill="#5b6573" text-anchor="middle" font-weight="bold">変化なし</text><text x="340" y="70" font-size="18" fill="#1f2a44" text-anchor="middle" font-weight="bold">イ</text><text x="340" y="92" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">日光に当てる</text><circle cx="340" cy="130" r="14" fill="#ffd166" stroke="#e08a00"/><ellipse cx="340" cy="200" rx="60" ry="30" transform="rotate(0 340 200)" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><path d="M340,240 L340,270" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><ellipse cx="340" cy="310" rx="60" ry="30" transform="rotate(0 340 310)" fill="#3b5ba5" stroke="#4f8a3c" stroke-width="2"/><text x="340" y="370" font-size="14" fill="#3b5ba5" text-anchor="middle" font-weight="bold">青むらさき色</text><text x="540" y="70" font-size="18" fill="#1f2a44" text-anchor="middle" font-weight="bold">ウ</text><text x="540" y="92" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">はくをかぶせたまま</text><rect x="510" y="118" width="60" height="24" fill="#c9ced6" stroke="#5b6573"/><text x="540" y="135" font-size="11" fill="#1f2a44" text-anchor="middle" font-weight="normal">はく</text><ellipse cx="540" cy="200" rx="60" ry="30" transform="rotate(0 540 200)" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><path d="M540,240 L540,270" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><ellipse cx="540" cy="310" rx="60" ry="30" transform="rotate(0 540 310)" fill="#f3f8ef" stroke="#4f8a3c" stroke-width="2"/><text x="540" y="370" font-size="14" fill="#5b6573" text-anchor="middle" font-weight="bold">変化なし</text><text x="340" y="400" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">たたき染めなどで葉の色をうつし、ヨウ素液にひたして比べる</text>
</svg>