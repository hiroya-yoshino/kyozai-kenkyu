<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 388" role="img" aria-label="気体ボンベから水上置換で集気びんに気体を集めるようす" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>気体ボンベから水上置換で集気びんに気体を集めるようす</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="600" height="388" fill="#fff"/>
<text x="300" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">気体を集気びんに集める（水上置換）</text><rect x="40" y="190" width="360" height="130" fill="url(#water)"/><path d="M40,80 L40,320 L400,320 L400,80" fill="none" stroke="#1f2a44" stroke-width="3"/><text x="110" y="342" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">水そう</text><rect x="170" y="96" width="100" height="94" fill="#f4fbf9"/><path d="M170,190 L270,190 L270,246 Q270,276 240,282 L240,306 L200,306 L200,282 Q170,276 170,246 z" fill="url(#water)"/><path d="M170,96 L270,96 L270,246 Q270,276 240,282 L240,306 M170,96 L170,246 Q170,276 200,282 L200,306" fill="none" stroke="#1f2a44" stroke-width="3"/><text x="220" y="148" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">集めた気体</text><text x="220" y="168" font-size="12" fill="#1e7f6e" text-anchor="middle" font-weight="normal">（水をおし出す）</text><circle cx="220" cy="266" r="5" fill="#fff" stroke="#1e7f6e" stroke-width="2"/><circle cx="216" cy="244" r="4" fill="#fff" stroke="#1e7f6e" stroke-width="2"/><circle cx="224" cy="222" r="3" fill="#fff" stroke="#1e7f6e" stroke-width="2"/><rect x="470" y="110" width="70" height="170" rx="20" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><rect x="490" y="90" width="30" height="22" fill="#1f2a44"/><text x="505" y="190" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">気体</text><text x="505" y="210" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">ボンベ</text><path d="M505,90 C505,60 440,56 420,70 C400,84 405,200 380,280 C360,330 260,330 220,312" fill="none" stroke="#1f2a44" stroke-width="5"/><text x="300" y="372" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">びんに水を満たして逆さに立て、口の下から気体を入れる。水の中でふたをしてとり出す</text>
</svg>