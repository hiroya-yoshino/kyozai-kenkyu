<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" role="img" aria-label="実験用てこが水平につり合うきまり（例：左30g×2、右20g×3）" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>実験用てこが水平につり合うきまり（例：左30g×2、右20g×3）</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="404" fill="#fff"/>
<text x="360" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">実験用てこがつり合うきまり</text><rect x="354" y="110" width="12" height="190" fill="#5b6573"/><rect x="300" y="300" width="120" height="14" fill="#5b6573"/><line x1="90" y1="110" x2="630" y2="110" stroke="#1f2a44" stroke-width="8"/><line x1="315" y1="102" x2="315" y2="118" stroke="#fff" stroke-width="2"/><text x="315" y="96" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">1</text><line x1="405" y1="102" x2="405" y2="118" stroke="#fff" stroke-width="2"/><text x="405" y="96" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">1</text><line x1="270" y1="102" x2="270" y2="118" stroke="#fff" stroke-width="2"/><text x="270" y="96" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">2</text><line x1="450" y1="102" x2="450" y2="118" stroke="#fff" stroke-width="2"/><text x="450" y="96" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">2</text><line x1="225" y1="102" x2="225" y2="118" stroke="#fff" stroke-width="2"/><text x="225" y="96" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">3</text><line x1="495" y1="102" x2="495" y2="118" stroke="#fff" stroke-width="2"/><text x="495" y="96" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">3</text><line x1="180" y1="102" x2="180" y2="118" stroke="#fff" stroke-width="2"/><text x="180" y="96" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">4</text><line x1="540" y1="102" x2="540" y2="118" stroke="#fff" stroke-width="2"/><text x="540" y="96" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">4</text><line x1="135" y1="102" x2="135" y2="118" stroke="#fff" stroke-width="2"/><text x="135" y="96" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">5</text><line x1="585" y1="102" x2="585" y2="118" stroke="#fff" stroke-width="2"/><text x="585" y="96" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">5</text><line x1="90" y1="102" x2="90" y2="118" stroke="#fff" stroke-width="2"/><text x="90" y="96" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">6</text><line x1="630" y1="102" x2="630" y2="118" stroke="#fff" stroke-width="2"/><text x="630" y="96" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">6</text><line x1="270" y1="110" x2="270" y2="140" stroke="#1f2a44" stroke-width="1.5"/><rect x="258" y="140" width="24" height="16" rx="3" fill="#9aa3ad" stroke="#1f2a44"/><rect x="258" y="158" width="24" height="16" rx="3" fill="#9aa3ad" stroke="#1f2a44"/><rect x="258" y="176" width="24" height="16" rx="3" fill="#9aa3ad" stroke="#1f2a44"/><text x="270" y="212" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="bold">30g</text><line x1="495" y1="110" x2="495" y2="140" stroke="#1f2a44" stroke-width="1.5"/><rect x="483" y="140" width="24" height="16" rx="3" fill="#9aa3ad" stroke="#1f2a44"/><rect x="483" y="158" width="24" height="16" rx="3" fill="#9aa3ad" stroke="#1f2a44"/><text x="495" y="194" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="bold">20g</text><rect x="80" y="330" width="560" height="62" rx="8" fill="#f4fbf9" stroke="#1e7f6e"/><text x="360" y="354" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">左：30g × 2 ＝ 60　　右：20g × 3 ＝ 60</text><text x="360" y="378" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">（おもりの重さ）×（支点からのきょり）が左右で等しいとき、水平につり合う</text>
