<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326" role="img" aria-label="光電池に当てる光の向きや当たり方と、つくられる電気の量" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>光電池に当てる光の向きや当たり方と、つくられる電気の量</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="326" fill="#fff"/>
<text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">光電池に当てる光の向きと発電</text><rect x="60" y="160" width="100" height="16" fill="#2f4b7c" stroke="#1f2a44" transform="rotate(0 110 168)"/><path d="M65,70 L65,140" stroke="#e0a800" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M95,70 L95,140" stroke="#e0a800" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M125,70 L125,140" stroke="#e0a800" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M155,70 L155,140" stroke="#e0a800" stroke-width="2" marker-end="url(#arr)" fill="none"/><text x="110" y="248" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">光に垂直</text><text x="110" y="270" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">モーターが速く回る</text><rect x="290" y="160" width="100" height="16" fill="#2f4b7c" stroke="#1f2a44" transform="rotate(-50 340 168)"/><path d="M295,70 L295,140" stroke="#e0a800" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M325,70 L325,140" stroke="#e0a800" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M355,70 L355,140" stroke="#e0a800" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M385,70 L385,140" stroke="#e0a800" stroke-width="2" marker-end="url(#arr)" fill="none"/><text x="340" y="248" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">かたむける</text><text x="340" y="270" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="bold">モーターがゆっくり回る</text><rect x="520" y="160" width="100" height="16" fill="#2f4b7c" stroke="#1f2a44" transform="rotate(0 570 168)"/><rect x="520" y="150" width="50" height="10" fill="#e6e6e6" stroke="#1f2a44"/><text x="545" y="144" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal">紙</text><path d="M525,70 L525,140" stroke="#e0a800" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M555,70 L555,140" stroke="#e0a800" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M585,70 L585,140" stroke="#e0a800" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M615,70 L615,140" stroke="#e0a800" stroke-width="2" marker-end="url(#arr)" fill="none"/><text x="570" y="248" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">一部をおおう</text><text x="570" y="270" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="bold">モーターがゆっくり回る</text><text x="340" y="310" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">光を強く、光電池に垂直に近い向きで当てるほど、多くの電気がつくられる</text>
</svg>