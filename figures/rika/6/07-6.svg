<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-label="流れる水に運ばれたつぶと火山灰のつぶの形のちがい" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>流れる水に運ばれたつぶと火山灰のつぶの形のちがい</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="640" height="350" fill="#fff"/>
<text x="320" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">つぶの形のちがい（けんび鏡で見たようす）</text><circle cx="170" cy="170" r="110" fill="#fbf7ef" stroke="#1f2a44" stroke-width="2.5"/><circle cx="130" cy="130" r="22" fill="#e3cfa8" stroke="#8a6d43" stroke-width="1.5"/><circle cx="190" cy="120" r="18" fill="#e3cfa8" stroke="#8a6d43" stroke-width="1.5"/><circle cx="150" cy="190" r="26" fill="#e3cfa8" stroke="#8a6d43" stroke-width="1.5"/><circle cx="215" cy="180" r="20" fill="#e3cfa8" stroke="#8a6d43" stroke-width="1.5"/><circle cx="120" cy="220" r="14" fill="#e3cfa8" stroke="#8a6d43" stroke-width="1.5"/><circle cx="200" cy="235" r="16" fill="#e3cfa8" stroke="#8a6d43" stroke-width="1.5"/><text x="170" y="312" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">流れる水に運ばれたつぶ</text><text x="170" y="332" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">角がとれて丸みがある</text><circle cx="470" cy="170" r="110" fill="#f7f9fb" stroke="#1f2a44" stroke-width="2.5"/><polygon points="430,120 460,105 470,140 440,150" fill="#cfd6de" stroke="#1f2a44" stroke-width="1.5"/><polygon points="480,130 520,120 510,160" fill="#ffffff" stroke="#1f2a44" stroke-width="1.5"/><polygon points="420,180 455,170 465,210 425,215" fill="#6b7280" stroke="#1f2a44" stroke-width="1.5"/><polygon points="490,190 530,185 520,225 495,230" fill="#cfd6de" stroke="#1f2a44" stroke-width="1.5"/><polygon points="460,235 485,225 480,255" fill="#ffffff" stroke="#1f2a44" stroke-width="1.5"/><text x="470" y="312" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">火山灰のつぶ</text><text x="470" y="332" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">角ばっている。とう明なつぶもある</text>
</svg>