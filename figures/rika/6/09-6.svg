<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" role="img" aria-label="手回し発電機でコンデンサーに電気をためて、豆電球で使う" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>手回し発電機でコンデンサーに電気をためて、豆電球で使う</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="336" fill="#fff"/>
<text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">コンデンサーに電気をためて使う</text><rect x="40" y="140" width="110" height="80" rx="14" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><line x1="95" y1="180" x2="95" y2="120" stroke="#1f2a44" stroke-width="5"/><circle cx="95" cy="114" r="8" fill="#1f2a44"/><path d="M60,100 A40,40 0 0 1 130,100" fill="none" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)"/><text x="95" y="188" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="bold">手回し</text><text x="95" y="204" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="bold">発電機</text><path d="M150,160 H240 M150,200 H240" stroke="#c8372d" stroke-width="3"/><rect x="240" y="140" width="70" height="80" rx="8" fill="#e8ecf6" stroke="#1f2a44" stroke-width="2.5"/><text x="275" y="186" font-size="11" fill="#1f2a44" text-anchor="middle" font-weight="bold">コンデン</text><text x="275" y="200" font-size="11" fill="#1f2a44" text-anchor="middle" font-weight="bold">サー</text><text x="232" y="156" font-size="14" fill="#c8372d" text-anchor="end" font-weight="bold">＋</text><text x="232" y="214" font-size="14" fill="#1f2a44" text-anchor="end" font-weight="bold">－</text><text x="170" y="250" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">① ためる（＋と－を正しくつなぐ）</text><path d="M330,180 L400,180" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="420" y="140" width="70" height="80" rx="8" fill="#e8ecf6" stroke="#1f2a44" stroke-width="2.5"/><text x="455" y="186" font-size="11" fill="#1f2a44" text-anchor="middle" font-weight="bold">コンデン</text><text x="455" y="200" font-size="11" fill="#1f2a44" text-anchor="middle" font-weight="bold">サー</text><path d="M490,160 H560 M490,200 H560" stroke="#c8372d" stroke-width="3"/><circle cx="585" cy="180" r="20" fill="#fff3b0" stroke="#1f2a44" stroke-width="2"/><rect x="573" y="198" width="24" height="18" fill="#5b6573"/><line x1="562" y1="169" x2="553" y2="164" stroke="#e0a800" stroke-width="2"/><line x1="569" y1="160" x2="563" y2="152" stroke="#e0a800" stroke-width="2"/><line x1="579" y1="155" x2="577" y2="145" stroke="#e0a800" stroke-width="2"/><line x1="591" y1="155" x2="593" y2="145" stroke="#e0a800" stroke-width="2"/><line x1="601" y1="160" x2="607" y2="152" stroke="#e0a800" stroke-width="2"/><line x1="608" y1="169" x2="617" y2="164" stroke="#e0a800" stroke-width="2"/><text x="530" y="250" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">② 使う（豆電球やLEDにつなぐ）</text><rect x="60" y="280" width="560" height="40" rx="8" fill="#fbecea" stroke="#c8372d"/><text x="340" y="306" font-size="13" fill="#c8372d" text-anchor="middle" font-weight="bold">⚠ ためたコンデンサーのたんしどうしを、直接つながない</text>
</svg>