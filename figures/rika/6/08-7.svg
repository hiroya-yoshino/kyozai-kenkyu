<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-label="てこを利用した道具の支点・力点・作用点の並び方" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>てこを利用した道具の支点・力点・作用点の並び方</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="436" fill="#fff"/>
<text x="360" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">てこを利用した道具（支点・力点・作用点の並び方）</text><text x="40" y="94" font-size="15" fill="#1f2a44" text-anchor="start" font-weight="bold">支点が間</text><text x="40" y="116" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">例：はさみ・くぎぬき</text><line x1="260" y1="90" x2="640" y2="90" stroke="#8a6d43" stroke-width="9" stroke-linecap="round"/><circle cx="280" cy="90" r="9" fill="#1e7f6e"/><text x="280" y="122" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">力点</text><circle cx="450" cy="90" r="9" fill="#1f2a44"/><text x="450" y="122" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">支点</text><circle cx="620" cy="90" r="9" fill="#c8372d"/><text x="620" y="122" font-size="13" fill="#c8372d" text-anchor="middle" font-weight="bold">作用点</text><text x="40" y="204" font-size="15" fill="#1f2a44" text-anchor="start" font-weight="bold">作用点が間</text><text x="40" y="226" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">例：せんぬき</text><line x1="260" y1="200" x2="640" y2="200" stroke="#8a6d43" stroke-width="9" stroke-linecap="round"/><circle cx="280" cy="200" r="9" fill="#1f2a44"/><text x="280" y="232" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">支点</text><circle cx="450" cy="200" r="9" fill="#c8372d"/><text x="450" y="232" font-size="13" fill="#c8372d" text-anchor="middle" font-weight="bold">作用点</text><circle cx="620" cy="200" r="9" fill="#1e7f6e"/><text x="620" y="232" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">力点</text><text x="40" y="314" font-size="15" fill="#1f2a44" text-anchor="start" font-weight="bold">力点が間</text><text x="40" y="336" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">例：ピンセット・トング</text><line x1="260" y1="310" x2="640" y2="310" stroke="#8a6d43" stroke-width="9" stroke-linecap="round"/><circle cx="280" cy="310" r="9" fill="#1f2a44"/><text x="280" y="342" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">支点</text><circle cx="450" cy="310" r="9" fill="#1e7f6e"/><text x="450" y="342" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">力点</text><circle cx="620" cy="310" r="9" fill="#c8372d"/><text x="620" y="342" font-size="13" fill="#c8372d" text-anchor="middle" font-weight="bold">作用点</text><text x="360" y="420" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">支点・力点・作用点の並び方で、力を大きくする道具と、細かい作業をしやすくする道具がある</text>
</svg>