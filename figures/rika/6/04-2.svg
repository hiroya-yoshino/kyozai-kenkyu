<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-label="けんび鏡で水中の小さな生物を観察する手順" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>けんび鏡で水中の小さな生物を観察する手順</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="290" fill="#fff"/>
<text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">けんび鏡で水中の小さな生物を見る手順</text><rect x="20" y="60" width="150" height="180" rx="10" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="95" y="210" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">① 池の水を1てき</text><text x="95" y="228" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">スライドガラスに</text><rect x="40" y="140" width="110" height="20" fill="#eef4f8" stroke="#1f2a44"/><circle cx="95" cy="138" r="7" fill="#9cc7e6"/><path d="M95,90 l0,30" stroke="#1f2a44" stroke-width="2"/><rect x="90" y="80" width="10" height="16" fill="#1f2a44"/><path d="M170,150 L184,150" stroke="#1f2a44" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="185" y="60" width="150" height="180" rx="10" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="260" y="210" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">② カバーガラスを</text><text x="260" y="228" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">端からそっとかける</text><rect x="205" y="150" width="110" height="20" fill="#eef4f8" stroke="#1f2a44"/><line x1="240" y1="150" x2="285" y2="118" stroke="#1e7f6e" stroke-width="4"/><path d="M335,150 L349,150" stroke="#1f2a44" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="350" y="60" width="150" height="180" rx="10" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="425" y="210" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">③ 低い倍率で</text><text x="425" y="228" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">ピントを合わせる</text><circle cx="425" cy="130" r="45" fill="#f4fbf9" stroke="#1f2a44" stroke-width="2"/><text x="425" y="136" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">×40〜100</text><path d="M500,150 L514,150" stroke="#1f2a44" stroke-width="2" marker-end="url(#arr)" fill="none"/><rect x="515" y="60" width="150" height="180" rx="10" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="590" y="210" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">④ 見つけたら</text><text x="590" y="228" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">倍率を上げる</text><circle cx="590" cy="130" r="45" fill="#f4fbf9" stroke="#1f2a44" stroke-width="2"/><ellipse cx="583" cy="128" rx="22" ry="12" fill="none" stroke="#1e7f6e" stroke-width="2"/><line x1="605" y1="128" x2="619" y2="118" stroke="#1e7f6e" stroke-width="2"/><text x="590" y="112" font-size="11" fill="#5b6573" text-anchor="middle" font-weight="normal">×100〜400</text><text x="340" y="272" font-size="12" fill="#c8372d" text-anchor="middle" font-weight="normal">直射日光の当たらない、明るい場所で使う</text>
</svg>