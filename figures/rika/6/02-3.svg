<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" role="img" aria-label="食べ物の通り道と消化・吸収の模式図" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>食べ物の通り道と消化・吸収の模式図</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="660" height="450" fill="#fff"/>
<text x="330" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">食べ物の通り道（消化管）と消化・吸収（模式図）</text><rect x="60" y="52" width="150" height="44" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="135.0" y="79.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">口</text><text x="230" y="79" font-size="13" fill="#5b6573" text-anchor="start" font-weight="normal">だ液</text><path d="M135,96 L135,118" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="60" y="118" width="150" height="44" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="135.0" y="145.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">食道</text><path d="M135,162 L135,184" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="60" y="184" width="150" height="44" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="135.0" y="211.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">胃</text><text x="230" y="211" font-size="13" fill="#5b6573" text-anchor="start" font-weight="normal">胃液</text><path d="M135,228 L135,250" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="60" y="250" width="150" height="44" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="135.0" y="277.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">小腸</text><text x="230" y="277" font-size="13" fill="#1e7f6e" text-anchor="start" font-weight="bold">消化液／養分を吸収</text><path d="M135,294 L135,316" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="60" y="316" width="150" height="44" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="135.0" y="343.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">大腸</text><text x="230" y="343" font-size="13" fill="#1e7f6e" text-anchor="start" font-weight="bold">主に水分を吸収</text><path d="M135,360 L135,382" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="60" y="382" width="150" height="44" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="135.0" y="409.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">こう門</text><text x="230" y="409" font-size="13" fill="#5b6573" text-anchor="start" font-weight="normal">残りをはい出</text><rect x="440" y="180" width="170" height="56" rx="8" fill="#f4fbf9" stroke="#1e7f6e" stroke-width="2"/><text x="525.0" y="205.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">肝臓</text><text x="525.0" y="225.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">養分をたくわえる</text><path d="M385,262 L460,236" stroke="#1e7f6e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)" fill="none"/><text x="470" y="290" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">小腸で吸収された養分は</text><text x="470" y="306" font-size="12" fill="#5b6573" text-anchor="start" font-weight="normal">血液で肝臓へ運ばれる</text>
</svg>