<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-label="生命を支える臓器と血液のつながりの模式図" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>生命を支える臓器と血液のつながりの模式図</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="660" height="460" fill="#fff"/>
<text x="330" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">生命を支える臓器のつながり（模式図）</text><circle cx="330" cy="245" r="62" fill="#fbecea" stroke="#c8372d" stroke-width="3"/><text x="330" y="241" font-size="18" fill="#c8372d" text-anchor="middle" font-weight="bold">血液</text><text x="330" y="263" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">（心臓が送る）</text><rect x="30" y="60" width="220" height="60" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="140.0" y="87.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">肺</text><text x="140.0" y="107.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">酸素を取り入れ、二酸化炭素を出す</text><line x1="250" y1="120" x2="284" y2="203" stroke="#1e7f6e" stroke-width="2.5"/><rect x="410" y="60" width="220" height="60" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="520.0" y="87.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">胃・小腸</text><text x="520.0" y="107.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">食べ物を消化し、養分を吸収</text><line x1="410" y1="120" x2="376" y2="203" stroke="#1e7f6e" stroke-width="2.5"/><rect x="410" y="370" width="220" height="60" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="520.0" y="397.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">じん臓</text><text x="520.0" y="417.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">不要なものをこしとり尿にする</text><line x1="410" y1="370" x2="376" y2="287" stroke="#1e7f6e" stroke-width="2.5"/><rect x="30" y="370" width="220" height="60" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="140.0" y="397.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">肝臓</text><text x="140.0" y="417.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">養分をたくわえる</text><line x1="250" y1="370" x2="284" y2="287" stroke="#1e7f6e" stroke-width="2.5"/>
</svg>