<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-label="鉄とアルミニウムにうすい塩酸を加えたときの変化" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>鉄とアルミニウムにうすい塩酸を加えたときの変化</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="640" height="352" fill="#fff"/>
<text x="320" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">金属にうすい塩酸を加える</text><path d="M150,80 L150,230 a16,16 0 0 0 32,0 L182,80" fill="none" stroke="#1f2a44" stroke-width="2.5"/><path d="M152,150 L152,230 a14,14 0 0 0 28,0 L180,150 z" fill="#fff8e1"/><text x="166" y="70" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">鉄（スチールウール）</text><path d="M430,80 L430,230 a16,16 0 0 0 32,0 L462,80" fill="none" stroke="#1f2a44" stroke-width="2.5"/><path d="M432,150 L432,230 a14,14 0 0 0 28,0 L460,150 z" fill="#fff8e1"/><text x="446" y="70" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">アルミニウム</text><path d="M156,228 q10,-10 20,0 q-10,10 -20,0" fill="#9aa3ad"/><circle cx="158" cy="215" r="3" fill="#fff" stroke="#3b8bc2"/><circle cx="165" cy="199" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="172" cy="183" r="3" fill="#fff" stroke="#3b8bc2"/><circle cx="163" cy="167" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="170" cy="151" r="3" fill="#fff" stroke="#3b8bc2"/><circle cx="161" cy="135" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="168" cy="119" r="3" fill="#fff" stroke="#3b8bc2"/><path d="M436,228 q10,-10 20,0 q-10,10 -20,0" fill="#9aa3ad"/><circle cx="438" cy="215" r="3" fill="#fff" stroke="#3b8bc2"/><circle cx="445" cy="199" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="452" cy="183" r="3" fill="#fff" stroke="#3b8bc2"/><circle cx="443" cy="167" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="450" cy="151" r="3" fill="#fff" stroke="#3b8bc2"/><circle cx="441" cy="135" r="4" fill="#fff" stroke="#3b8bc2"/><circle cx="448" cy="119" r="3" fill="#fff" stroke="#3b8bc2"/><text x="320" y="290" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">どちらも、あわを出してとけていく</text><rect x="120" y="305" width="400" height="34" rx="8" fill="#fbecea" stroke="#c8372d"/><text x="320" y="327" font-size="13" fill="#c8372d" text-anchor="middle" font-weight="bold">⚠ 出てくる気体は燃えやすい。近くで火を使わない</text>
</svg>