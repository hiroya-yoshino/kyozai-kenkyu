<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" role="img" aria-label="吸う空気とはき出した息のちがいを調べる実験と結果の目安" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>吸う空気とはき出した息のちがいを調べる実験と結果の目安</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="436" fill="#fff"/>
<text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">吸う空気とはき出した息のちがいを調べる</text><path d="M70,90 q-10,90 10,170 h120 q20,-80 10,-170 z" fill="#f7f9fb" stroke="#1f2a44" stroke-width="2.5"/><rect x="128" y="72" width="24" height="20" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="140" y="160" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">吸う空気</text><text x="140" y="182" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">（まわりの空気）</text><path d="M400,90 q-10,90 10,170 h120 q20,-80 10,-170 z" fill="#f7f9fb" stroke="#1f2a44" stroke-width="2.5"/><rect x="458" y="72" width="24" height="20" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="470" y="160" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">はき出した息</text><text x="470" y="182" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">（ストローで入れる）</text><text x="140" y="288" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">吸う空気</text><text x="470" y="288" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">はき出した息</text><text x="305" y="314" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">酸素</text><text x="140" y="314" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">約21%</text><text x="470" y="314" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">約17%</text><line x1="40" y1="326" x2="640" y2="326" stroke="#dce6ee"/><text x="305" y="348" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">二酸化炭素</text><text x="140" y="348" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">約0.04%</text><text x="470" y="348" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">約4%</text><line x1="40" y1="360" x2="640" y2="360" stroke="#dce6ee"/><text x="305" y="382" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">石灰水</text><text x="140" y="382" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">ほとんどにごらない</text><text x="470" y="382" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">白くにごる</text><line x1="40" y1="394" x2="640" y2="394" stroke="#dce6ee"/><text x="340" y="420" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">気体検知管の値は目安。はき出した息は酸素が減り、二酸化炭素がふえる</text>
</svg>