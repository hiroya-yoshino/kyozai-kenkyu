<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" role="img" aria-label="色水を吸わせたホウセンカの茎と葉の切り口" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>色水を吸わせたホウセンカの茎と葉の切り口</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="444" fill="#fff"/>
<text x="360" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">色水を吸わせたホウセンカと切り口</text><path d="M110,300 L80,380 L200,380 L170,300 L170,250 L110,250 z" fill="#fde4ee" stroke="#1f2a44" stroke-width="2.5"/><rect x="83" y="340" width="114" height="38" fill="#f4a6c5" opacity=".7"/><text x="140" y="400" font-size="13" fill="#c2185b" text-anchor="middle" font-weight="bold">色水</text><line x1="140" y1="370" x2="140" y2="90" stroke="#4f8a3c" stroke-width="5"/><ellipse cx="172" cy="120" rx="26" ry="12" transform="rotate(25 172 120)" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><ellipse cx="110" cy="160" rx="26" ry="12" transform="rotate(-25 110 160)" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><ellipse cx="172" cy="200" rx="26" ry="12" transform="rotate(25 172 200)" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><path d="M140,370 l-14,10 M140,370 l12,12 M140,372 l0,14" stroke="#4f8a3c" stroke-width="2"/><text x="140" y="70" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">ホウセンカ</text><circle cx="380" cy="150" r="60" fill="#f3f8ef" stroke="#4f8a3c" stroke-width="2.5"/><circle cx="418.0" cy="150.0" r="7" fill="#c2185b"/><circle cx="406.9" cy="176.9" r="7" fill="#c2185b"/><circle cx="380.0" cy="188.0" r="7" fill="#c2185b"/><circle cx="353.1" cy="176.9" r="7" fill="#c2185b"/><circle cx="342.0" cy="150.0" r="7" fill="#c2185b"/><circle cx="353.1" cy="123.1" r="7" fill="#c2185b"/><circle cx="380.0" cy="112.0" r="7" fill="#c2185b"/><circle cx="406.9" cy="123.1" r="7" fill="#c2185b"/><text x="380" y="238" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">茎（横に切る）</text><text x="380" y="256" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">輪のように染まる</text><rect x="545" y="90" width="70" height="130" fill="#f3f8ef" stroke="#4f8a3c" stroke-width="2.5"/><line x1="562" y1="90" x2="562" y2="220" stroke="#c2185b" stroke-width="5"/><line x1="598" y1="90" x2="598" y2="220" stroke="#c2185b" stroke-width="5"/><text x="580" y="238" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">茎（縦に切る）</text><text x="580" y="256" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">管がすじのように続く</text><ellipse cx="480" cy="340" rx="80" ry="34" transform="rotate(0 480 340)" fill="#f3f8ef" stroke="#4f8a3c" stroke-width="2"/><path d="M400,340 L560,340 M440,340 l20,-18 M440,340 l20,18 M490,340 l20,-20 M490,340 l20,20" stroke="#c2185b" stroke-width="3" fill="none"/><text x="480" y="400" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">葉（すじ＝葉脈が染まる）</text><text x="360" y="430" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">色水で染まった部分が、根から吸い上げた水の通り道</text>
</svg>