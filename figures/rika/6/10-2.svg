<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" role="img" aria-label="人の生活が空気・水・生物にあたえる影響と環境を守る取り組み" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>人の生活が空気・水・生物にあたえる影響と環境を守る取り組み</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="436" fill="#fff"/>
<text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">人の生活と環境（空気・水・生物）とのかかわり</text><circle cx="340" cy="200" r="60" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><text x="340" y="196" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">人の</text><text x="340" y="216" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">生活</text><rect x="10" y="54" width="220" height="72" rx="8" fill="#eef6fb" stroke="#1f2a44" stroke-width="2"/><text x="120.0" y="87.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">空気</text><text x="120.0" y="107.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">燃料を燃やす→二酸化炭素がふえる</text><line x1="274" y1="162" x2="153" y2="126" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)"/><rect x="450" y="54" width="220" height="72" rx="8" fill="#eef6fb" stroke="#1f2a44" stroke-width="2"/><text x="560.0" y="87.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">水</text><text x="560.0" y="107.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">生活はい水→川や海がよごれる</text><line x1="406" y1="162" x2="527" y2="126" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)"/><rect x="230" y="314" width="220" height="72" rx="8" fill="#e3f0dc" stroke="#1f2a44" stroke-width="2"/><text x="340.0" y="347.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">生物</text><text x="340.0" y="367.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">開発→すみかが減る</text><line x1="340" y1="252" x2="340" y2="314" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)"/><text x="340" y="420" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">環境を守る取り組み：再生可能エネルギー、下水処理、森林や生物の保護 など</text>
</svg>