<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="肺のはたらきの模式図" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>肺のはたらきの模式図</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="640" height="440" fill="#fff"/>
<text x="320" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">肺のはたらき（模式図）</text><rect x="250" y="50" width="140" height="44" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="320.0" y="77.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">口・鼻</text><path d="M320,94 L320,124" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><rect x="250" y="124" width="140" height="44" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="320.0" y="151.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">気管</text><path d="M300,168 L190,200" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><path d="M340,168 L450,200" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><ellipse cx="170" cy="270" rx="90" ry="66" fill="#fbecea" stroke="#1f2a44" stroke-width="2.5"/><text x="170" y="266" font-size="18" fill="#1f2a44" text-anchor="middle" font-weight="bold">肺</text><ellipse cx="470" cy="270" rx="90" ry="66" fill="#fbecea" stroke="#1f2a44" stroke-width="2.5"/><text x="470" y="266" font-size="18" fill="#1f2a44" text-anchor="middle" font-weight="bold">肺</text><text x="170" y="292" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">（左）</text><text x="470" y="292" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">（右）</text><rect x="130" y="360" width="380" height="64" rx="8" fill="#fff" stroke="#1e7f6e" stroke-width="2"/><text x="320" y="384" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">肺の中の血管で</text><text x="320" y="406" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">酸素 → 血液へ ／ 血液から → 二酸化炭素</text>
</svg>