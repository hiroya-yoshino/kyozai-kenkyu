<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-label="棒を使ったてこの支点・力点・作用点" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>棒を使ったてこの支点・力点・作用点</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="320" fill="#fff"/>
<text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">棒を使ったてこ（支点・力点・作用点）</text><line x1="60" y1="170" x2="620" y2="170" stroke="#8a6d43" stroke-width="10" stroke-linecap="round"/><path d="M214,198 L230,176 L246,198 z" fill="#5b6573"/><circle cx="230" cy="170" r="7" fill="#1f2a44"/><text x="230" y="216" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">支点</text><circle cx="590" cy="170" r="7" fill="#1e7f6e"/><text x="590" y="118" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">力点</text><path d="M590,126 L590,158" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><circle cx="100" cy="170" r="7" fill="#c8372d"/><text x="100" y="118" font-size="13" fill="#c8372d" text-anchor="middle" font-weight="bold">作用点</text><line x1="100" y1="170" x2="100" y2="210" stroke="#1f2a44" stroke-width="2"/><rect x="70" y="210" width="60" height="50" rx="8" fill="#d9c7a4" stroke="#1f2a44"/><text x="100" y="240" font-size="12" fill="#1f2a44" text-anchor="middle" font-weight="normal">砂ぶくろ</text><path d="M260,240 H580" stroke="#1e7f6e" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="262" font-size="13" fill="#1e7f6e" text-anchor="middle" font-weight="bold">支点から力点までを長くすると楽</text><path d="M220,280 H112" stroke="#c8372d" stroke-width="2" marker-end="url(#arr)"/><text x="166" y="302" font-size="13" fill="#c8372d" text-anchor="middle" font-weight="bold">支点から作用点までを短くすると楽</text>
</svg>