<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="地層のようすの模式図" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>地層のようすの模式図</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="360" fill="#fff"/>
<defs>
<pattern id="gravel" width="24" height="16" patternUnits="userSpaceOnUse"><rect width="24" height="16" fill="#e9dcc8"/><circle cx="6" cy="6" r="4" fill="#b8a07e"/><circle cx="17" cy="11" r="3.5" fill="#a88e6a"/></pattern>
<pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3e3b8"/><circle cx="2" cy="3" r="1" fill="#c9ae6e"/><circle cx="7" cy="7" r="1" fill="#c9ae6e"/></pattern>
<pattern id="mud" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#c9b8a6"/><path d="M0,5 h10" stroke="#a8957f" stroke-width="1"/></pattern>
<pattern id="ash" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#e6e6e6"/><path d="M2,2 l3,2 l-2,3 z" fill="#9aa3ad"/></pattern>
</defs><text x="360" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">地層のようす（模式図）</text><path d="M40,60 L420,52 L420,92 L40,100 z" fill="url(#mud)" stroke="#1f2a44" stroke-width="1"/><text x="440" y="80.0" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">どろの層</text><path d="M40,100 L420,92 L420,138 L40,146 z" fill="url(#sand)" stroke="#1f2a44" stroke-width="1"/><text x="440" y="123.0" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">砂の層</text><path d="M40,146 L420,138 L420,168 L40,176 z" fill="url(#ash)" stroke="#1f2a44" stroke-width="1"/><text x="440" y="161.0" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">火山灰の層</text><path d="M40,176 L420,168 L420,218 L40,226 z" fill="url(#gravel)" stroke="#1f2a44" stroke-width="1"/><text x="440" y="201.0" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">れきの層</text><path d="M40,226 L420,218 L420,262 L40,270 z" fill="url(#sand)" stroke="#1f2a44" stroke-width="1"/><text x="440" y="248.0" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">砂の層</text><path d="M40,270 L420,262 L420,302 L40,310 z" fill="url(#mud)" stroke="#1f2a44" stroke-width="1"/><text x="440" y="290.0" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="bold">どろの層</text><path d="M150,248 q12,-14 24,0 q-12,8 -24,0" fill="#fff" stroke="#1f2a44" stroke-width="1.5"/><text x="230" y="254" font-size="12" fill="#1f2a44" text-anchor="start" font-weight="bold">← 化石（貝など）</text><text x="260" y="345" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">つぶの大きさや色のちがう層が重なり、横にも広がっている</text>
</svg>