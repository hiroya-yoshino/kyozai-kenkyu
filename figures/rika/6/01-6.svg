<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" role="img" aria-label="ろうそくを燃やす前と後の酸素と二酸化炭素の割合の目安" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>ろうそくを燃やす前と後の酸素と二酸化炭素の割合の目安</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="660" height="350" fill="#fff"/>
<text x="330" y="30" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">ろうそくを燃やす前と後の空気（結果の目安）</text><rect x="120" y="91" width="60" height="189" fill="#1e7f6e"/><text x="150" y="83" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">約21%</text><rect x="200" y="278" width="60" height="2" fill="url(#clay)" stroke="#1f2a44" stroke-width="1.5"/><text x="230" y="270" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">約0.04%</text><text x="190" y="306" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">燃やす前</text><rect x="380" y="127" width="60" height="153" fill="#1e7f6e"/><text x="410" y="119" font-size="14" fill="#1e7f6e" text-anchor="middle" font-weight="bold">約17%</text><rect x="460" y="253" width="60" height="27" fill="url(#clay)" stroke="#1f2a44" stroke-width="1.5"/><text x="490" y="245" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="bold">約3%</text><text x="450" y="306" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">燃やした後</text><line x1="90" y1="280" x2="600" y2="280" stroke="#1f2a44" stroke-width="2"/><rect x="440" y="52" width="16" height="16" fill="#1e7f6e"/><text x="462" y="65" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">酸素</text><rect x="510" y="52" width="16" height="16" fill="url(#clay)" stroke="#1f2a44"/><text x="532" y="65" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">二酸化炭素</text><text x="330" y="334" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">酸素は一部が使われて減り、二酸化炭素がふえる（ちっ素はほとんど変わらない）</text>
</svg>