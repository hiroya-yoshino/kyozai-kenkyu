<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="気体検知管の使い方" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>気体検知管の使い方</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="300" fill="#fff"/>
<text x="360" y="30" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">気体検知管の使い方</text><text x="40" y="74" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">①両はしを折り、ゴムカバーをつける</text><text x="40" y="100" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">②採取器に矢印の向きに差しこむ</text><text x="40" y="126" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">③びんの中に入れ、ハンドルを引く</text><text x="40" y="152" font-size="14" fill="#1f2a44" text-anchor="start" font-weight="normal">④決められた時間待ち、目もりを読む</text><rect x="300" y="210" width="260" height="40" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2.5"/><text x="430" y="236" font-size="14" fill="#1f2a44" text-anchor="middle" font-weight="normal">気体採取器</text><rect x="560" y="222" width="60" height="16" fill="#1f2a44"/><text x="600" y="270" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">ハンドル</text><rect x="120" y="222" width="180" height="16" fill="#fff" stroke="#1f2a44" stroke-width="2"/><rect x="150" y="224" width="70" height="12" fill="#d8c4e8"/><line x1="150" y1="222" x2="150" y2="214" stroke="#1f2a44" stroke-width="1.5"/><line x1="175" y1="222" x2="175" y2="214" stroke="#1f2a44" stroke-width="1.5"/><line x1="200" y1="222" x2="200" y2="214" stroke="#1f2a44" stroke-width="1.5"/><line x1="225" y1="222" x2="225" y2="214" stroke="#1f2a44" stroke-width="1.5"/><line x1="250" y1="222" x2="250" y2="214" stroke="#1f2a44" stroke-width="1.5"/><line x1="275" y1="222" x2="275" y2="214" stroke="#1f2a44" stroke-width="1.5"/><line x1="300" y1="222" x2="300" y2="214" stroke="#1f2a44" stroke-width="1.5"/><path d="M170,200 L250,200" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)"/><text x="210" y="192" font-size="12" fill="#1e7f6e" text-anchor="middle" font-weight="normal">気体の流れる向き</text><text x="185" y="270" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">色が変わったさかい目の目もりを読む</text><rect x="440" y="60" width="240" height="98" rx="8" fill="#fbecea" stroke="#c8372d" stroke-width="2"/><text x="560" y="86" font-size="14" fill="#c8372d" text-anchor="middle" font-weight="bold">⚠ 注意</text><text x="560" y="110" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">酸素用検知管は使った後</text><text x="560" y="130" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">とても熱くなるので、</text><text x="560" y="150" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="normal">しばらくさわらない</text>
</svg>