<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="404" fill="#fff"/>
<text x="140" y="34" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">ア　下にすき間・上はあける</text><rect x="50" y="290" width="70" height="22" fill="url(#clay)" stroke="#1f2a44" stroke-width="1.5"/><rect x="160" y="290" width="70" height="22" fill="url(#clay)" stroke="#1f2a44" stroke-width="1.5"/><rect x="120" y="296" width="40" height="16" fill="url(#clay)" stroke="#1f2a44" stroke-width="1.5"/><path d="M110.0,70 L110.0,100 Q70,110 70,140 L70,290 M170.0,70 L170.0,100 Q210,110 210,140 L210,290" fill="none" stroke="#1f2a44" stroke-width="3"/><rect x="132" y="244" width="16" height="52" fill="#fff" stroke="#1f2a44" stroke-width="2"/><line x1="140" y1="244" x2="140" y2="236" stroke="#1f2a44" stroke-width="2"/><ellipse cx="140" cy="224" rx="7" ry="16" fill="#ffd166" stroke="#e08a00" stroke-width="1.5"/><path d="M30,294 L64,294" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)"/><path d="M250,294 L216,294" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)"/><path d="M140,90 L140,44" stroke="#1e7f6e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="80" y="330" width="120" height="30" rx="15" fill="#e3f1ee"/><text x="140" y="351" font-size="15" fill="#1e7f6e" text-anchor="middle" font-weight="bold">燃え続ける</text><text x="380" y="34" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">イ　下のすき間なし・上はあける</text><rect x="290" y="290" width="180" height="22" fill="url(#clay)" stroke="#1f2a44" stroke-width="1.5"/><path d="M350.0,70 L350.0,100 Q310,110 310,140 L310,290 M410.0,70 L410.0,100 Q450,110 450,140 L450,290" fill="none" stroke="#1f2a44" stroke-width="3"/><rect x="372" y="238" width="16" height="52" fill="#fff" stroke="#1f2a44" stroke-width="2"/><line x1="380" y1="238" x2="380" y2="230" stroke="#1f2a44" stroke-width="2"/><ellipse cx="380" cy="224" rx="5" ry="10" fill="#ffd166" stroke="#e08a00" stroke-width="1.5"/><path d="M380,90 L380,44" stroke="#1e7f6e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="320" y="330" width="120" height="30" rx="15" fill="#eef1f4"/><text x="380" y="351" font-size="15" fill="#5b6573" text-anchor="middle" font-weight="bold">やがて消える</text><text x="620" y="34" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">ウ　下にすき間・上にふた</text><rect x="530" y="290" width="70" height="22" fill="url(#clay)" stroke="#1f2a44" stroke-width="1.5"/><rect x="640" y="290" width="70" height="22" fill="url(#clay)" stroke="#1f2a44" stroke-width="1.5"/><rect x="600" y="296" width="40" height="16" fill="url(#clay)" stroke="#1f2a44" stroke-width="1.5"/><path d="M590.0,70 L590.0,100 Q550,110 550,140 L550,290 M650.0,70 L650.0,100 Q690,110 690,140 L690,290" fill="none" stroke="#1f2a44" stroke-width="3"/><rect x="582.0" y="60" width="76" height="10" rx="2" fill="#1f2a44"/><rect x="612" y="244" width="16" height="52" fill="#fff" stroke="#1f2a44" stroke-width="2"/><line x1="620" y1="244" x2="620" y2="236" stroke="#1f2a44" stroke-width="2"/><ellipse cx="620" cy="230" rx="5" ry="10" fill="#ffd166" stroke="#e08a00" stroke-width="1.5"/><path d="M510,294 L544,294" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)"/><path d="M730,294 L696,294" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)"/><rect x="560" y="330" width="120" height="30" rx="15" fill="#eef1f4"/><text x="620" y="351" font-size="15" fill="#5b6573" text-anchor="middle" font-weight="bold">やがて消える</text><text x="360" y="392" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">矢印（→）は空気の入る向き・出る向き</text>
</svg>