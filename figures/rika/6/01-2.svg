<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" role="img" aria-label="底のないびんでの空気の通り道とろうそくの燃え方" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>底のないびんでの空気の通り道とろうそくの燃え方</title>
<defs>
