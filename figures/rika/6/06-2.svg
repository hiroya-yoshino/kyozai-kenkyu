<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img" aria-label="夕方に見える月の形と位置の変化" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>夕方に見える月の形と位置の変化</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="720" height="396" fill="#fff"/>
<text x="360" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">夕方（日の入りのころ）の月の形と位置</text><path d="M30,300 H690" stroke="#1f2a44" stroke-width="3"/><text x="80" y="326" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">東</text><text x="360" y="326" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">南</text><text x="640" y="326" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">西</text><circle cx="660" cy="292" r="20" fill="#ffd166" stroke="#e08a00" stroke-width="2"/><text x="660" y="262" font-size="13" fill="#5b6573" text-anchor="middle" font-weight="normal">太陽</text><circle cx="560" cy="230" r="26" fill="#5b6573"/><path d="M560,204 A26,26 0 0 1 560,256 A19.0,26 0 0 0 560,204 z" fill="#fff3b0" stroke="#5b6573" stroke-width="1"/><text x="560" y="280" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">三日月（数日後）</text><circle cx="360" cy="110" r="26" fill="#5b6573"/><path d="M360,84 A26,26 0 0 1 360,136 A0.0,26 0 0 0 360,84 z" fill="#fff3b0" stroke="#5b6573" stroke-width="1"/><text x="360" y="160" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">半月（上弦の月）</text><circle cx="110" cy="210" r="26" fill="#5b6573"/><path d="M110,184 A26,26 0 0 0 110,236 A26.0,26 0 0 0 110,184 z" fill="#fff3b0" stroke="#5b6573" stroke-width="1"/><text x="110" y="260" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">満月</text><text x="360" y="360" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">南を向いて見たようす。月の光っている側に太陽がある</text><text x="360" y="380" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">日がたつにつれて、夕方の月は西→南→東へと位置が変わり、形も満ちていく</text>
</svg>