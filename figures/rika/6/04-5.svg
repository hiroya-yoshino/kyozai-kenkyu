<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" role="img" aria-label="空気や水を通した生物と環境のかかわりの模式図" font-family="'Hiragino Sans','Yu Gothic','Noto Sans JP',Meiryo,sans-serif">
<title>空気や水を通した生物と環境のかかわりの模式図</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7f6e"/></marker>
<pattern id="clay" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe7dc"/><path d="M0,8 L8,0" stroke="#b9a68c" stroke-width="1"/></pattern>
<pattern id="water" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#e6f1f7"/><path d="M0,3 q2.5,-2 5,0 t5,0" fill="none" stroke="#8fb3c9" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="396" fill="#fff"/>
<text x="340" y="28" font-size="16" fill="#1f2a44" text-anchor="middle" font-weight="bold">空気や水を通した生物と環境のかかわり（模式図）</text><rect x="60" y="120" width="170" height="64" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="2"/><text x="145.0" y="149.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">動物・ヒト</text><text x="145.0" y="169.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">呼吸をする</text><rect x="450" y="120" width="170" height="64" rx="8" fill="#e3f0dc" stroke="#4f8a3c" stroke-width="2"/><text x="535.0" y="149.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">植物</text><text x="535.0" y="169.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">呼吸／日光で養分をつくる</text><path d="M230,140 L448,140" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><text x="340" y="130" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">二酸化炭素</text><path d="M450,168 L232,168" stroke="#1e7f6e" stroke-width="2.5" marker-end="url(#arr)" fill="none"/><text x="340" y="190" font-size="13" fill="#1f2a44" text-anchor="middle" font-weight="bold">酸素</text><rect x="250" y="290" width="180" height="56" rx="8" fill="#eef6fb" stroke="#3b8bc2" stroke-width="2"/><text x="340.0" y="315.0" font-size="15" fill="#1f2a44" text-anchor="middle" font-weight="bold">水</text><text x="340.0" y="335.0" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">雨・川・海・水蒸気</text><line x1="145" y1="186" x2="255" y2="300" stroke="#3b8bc2" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="535" y1="186" x2="425" y2="300" stroke="#3b8bc2" stroke-width="2.5" stroke-dasharray="7 5"/><text x="340" y="380" font-size="12" fill="#5b6573" text-anchor="middle" font-weight="normal">生物は水を取り入れ、はい出物や蒸散で水を出す。水は形を変えてめぐる</text>
</svg>