<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f2a44">
  <meta name="description" content="単元ごとの時数・毎時間の流れ・実験と図をまとめた教材研究ノート">
  <title>教材研究ノート</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="#/">教材研究ノート</a>
  </header>
  <div class="layout">
    <aside id="side" class="side" hidden></aside>
    <main id="app" class="main" tabindex="-1"></main>
  </div>
  <dialog id="goals" class="goals-dialog" aria-labelledby="goals-title">
    <div class="dialog-inner">
      <div class="dialog-head">
        <h2 id="goals-title">🎯 単元の目標</h2>
        <button type="button" class="dialog-close" aria-label="閉じる">×</button>
      </div>
      <dl class="goals-list"></dl>
    </div>
  </dialog>
  <dialog id="figure" class="figure-dialog" aria-label="図">
    <div class="dialog-inner">
      <div class="dialog-head">
        <p class="figure-dialog-caption"></p>
        <button type="button" class="dialog-close" aria-label="閉じる">×</button>
      </div>
      <img class="figure-dialog-img" alt="">
      <p class="figure-dialog-hint">スマホを横向きにすると、図を大きく見られます</p>
    </div>
  </dialog>
</body>
</html>
